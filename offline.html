<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're offline — Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>(function(){try{var t=localStorage.getItem("progressTheme");var dark=(t==="dark")||(t!=="light"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(dark)document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<style>
  .offline-wrap { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 24px; text-align:center; }
  .offline-logo { width:64px; height:64px; border-radius:16px; margin-bottom:24px; opacity:.7; }
  .offline-wordmark { font-family:var(--font-serif); font-style:italic; font-size:32px; font-weight:600; color:var(--ink); margin-bottom:32px; letter-spacing:-.5px; }
  .offline-icon { font-size:56px; margin-bottom:20px; filter:grayscale(1); opacity:.5; }
  .offline-title { font-family:var(--font-serif); font-size:24px; font-weight:600; color:var(--ink); margin:0 0 10px; }
  .offline-sub { font-size:15px; color:var(--muted); line-height:1.6; max-width:320px; margin:0 auto 32px; }
  .offline-retry { padding:12px 28px; background:var(--ink); color:var(--cream); border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; transition:opacity .15s; }
  .offline-retry:hover { opacity:.85; }
</style>
</head>
<body>
<div class="offline-wrap">
  <img class="offline-logo" src="/images/nearheader.png" alt="Progress">
  <div class="offline-wordmark">progress.</div>
  <div class="offline-icon">📡</div>
  <h1 class="offline-title">You're offline</h1>
  <p class="offline-sub">Progress needs a connection to load new posts and messages. Check your connection and try again.</p>
  <button class="offline-retry" onclick="window.location.reload()">Try again</button>
</div>
</body>
</html>
