<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem("progressTheme");var dark=(t==="dark")||(t!=="light"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(dark)document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<link rel="stylesheet" href="v2-compat.css">
<link rel="stylesheet" href="style.css">
<style>
#nav-root { display:none !important; }
body { background: var(--v2-bg); }

.v2-profile-page { max-width: 760px; margin: 0 auto; padding: 40px 24px 100px; }
@media (max-width: 740px) { .v2-profile-page { padding: 24px 0 88px; } }

/* Settings wrapper gets v2 overrides */
.settings-wrap {
  background: transparent !important;
}

/* Tab bar */
.settings-tabs {
  display: flex !important;
  gap: 4px !important;
  border-bottom: 1px solid var(--v2-border) !important;
  margin-bottom: 32px !important;
  overflow-x: auto !important;
  scrollbar-width: none !important;
}
.settings-tabs::-webkit-scrollbar { display: none !important; }
.settings-tab {
  padding: 10px 16px !important;
  border: none !important;
  border-bottom: 2px solid transparent !important;
  background: transparent !important;
  font-family: var(--v2-font-b) !important;
  font-size: 14px !important;
  font-weight: 500 !important;
  color: var(--v2-muted) !important;
  cursor: pointer !important;
  white-space: nowrap !important;
  margin-bottom: -1px !important;
  transition: color .15s !important;
}
.settings-tab:hover { color: var(--v2-ink) !important; }
.settings-tab.active { color: var(--v2-ink) !important; font-weight: 600 !important; border-bottom-color: var(--v2-ink) !important; }

/* Avatar row */
.settings-avatar-row {
  display: flex !important; flex-direction: column !important;
  align-items: center !important; gap: 12px !important;
  margin-bottom: 32px !important;
}
.settings-avatar {
  width: 80px !important; height: 80px !important;
  border-radius: 50% !important; border: 3px solid var(--v2-border) !important;
  object-fit: cover !important;
}
.change-avatar-btn {
  background: var(--v2-paper) !important; color: var(--v2-ink) !important;
  border: 1.5px solid var(--v2-border) !important; border-radius: 22px !important;
  font-family: var(--v2-font-b) !important; font-size: 13px !important;
  font-weight: 600 !important; padding: 7px 16px !important; cursor: pointer !important;
  transition: border-color .15s !important;
}
.change-avatar-btn:hover { border-color: var(--v2-border-2) !important; }

/* Form fields */
.sett-field { margin-bottom: 20px !important; }
.sett-label {
  display: block !important; font-size: 13px !important; font-weight: 600 !important;
  color: var(--v2-ink) !important; margin-bottom: 6px !important;
}
.sett-input, .sett-textarea, .settings-wrap input[type=text],
.settings-wrap input[type=email], .settings-wrap input[type=password],
.settings-wrap textarea, .settings-wrap select {
  width: 100% !important; padding: 10px 14px !important;
  border: 1.5px solid var(--v2-border) !important;
  border-radius: var(--r-md) !important;
  background: var(--v2-paper) !important;
  color: var(--v2-ink) !important;
  font-family: var(--v2-font-b) !important; font-size: 15px !important;
  outline: none !important; transition: border-color .15s, box-shadow .15s !important;
  box-sizing: border-box !important;
}
.settings-wrap input:focus, .settings-wrap textarea:focus, .settings-wrap select:focus {
  border-color: var(--v2-accent) !important;
  box-shadow: 0 0 0 3px var(--v2-accent-dim) !important;
}
.settings-wrap input::placeholder, .settings-wrap textarea::placeholder { color: var(--v2-muted) !important; }
.settings-wrap textarea { min-height: 90px !important; resize: vertical !important; }

/* Buttons */
.settings-wrap .btn.primary, .settings-wrap button[type=submit],
.settings-wrap .upload-btn {
  background: var(--v2-ink) !important; color: var(--v2-bg) !important;
  border: none !important; border-radius: 22px !important;
  font-family: var(--v2-font-b) !important; font-size: 14px !important;
  font-weight: 600 !important; padding: 10px 24px !important; cursor: pointer !important;
}
.settings-wrap .btn.primary:hover, .settings-wrap button[type=submit]:hover { opacity: .9 !important; }
.settings-wrap .btn.secondary {
  background: var(--v2-paper) !important; color: var(--v2-ink) !important;
  border: 1.5px solid var(--v2-border) !important; border-radius: 22px !important;
  font-size: 14px !important; font-weight: 600 !important;
}
.settings-wrap .btn.secondary:hover { border-color: var(--v2-border-2) !important; }

/* Toggle rows */
.sett-toggle-row {
  display: flex !important; align-items: center !important; justify-content: space-between !important;
  padding: 14px 0 !important; border-bottom: 1px solid var(--v2-border) !important;
  gap: 12px !important; cursor: pointer !important;
}
.sett-toggle-row:last-child { border-bottom: none !important; }
.theme-toggle-switch {
  flex-shrink: 0 !important; width: 40px !important; height: 22px !important;
  border-radius: 11px !important; background: var(--v2-border) !important;
  border: none !important; position: relative !important; cursor: pointer !important;
  transition: background .2s !important;
}
.theme-toggle-switch.on { background: var(--v2-ink) !important; }
.theme-toggle-switch::after {
  content: "" !important; position: absolute !important;
  top: 3px !important; left: 3px !important;
  width: 16px !important; height: 16px !important; border-radius: 50% !important;
  background: var(--v2-paper) !important; transition: transform .2s !important;
}
.theme-toggle-switch.on::after { transform: translateX(18px) !important; }

/* Section headers — v2 invented name + actual v1 name */
.settings-section-title, .sett-section-title {
  font-size: 10px !important; font-weight: 700 !important; letter-spacing: .1em !important;
  text-transform: uppercase !important; color: var(--v2-muted) !important;
  font-family: var(--v2-font-m) !important; margin: 28px 0 14px !important;
}

/* Panel title (large heading above each settings panel) */
.sett-panel-title {
  font-family: var(--v2-font-d) !important; font-style: italic !important;
  font-size: 22px !important; font-weight: 600 !important;
  color: var(--v2-ink) !important; border-bottom-color: var(--v2-border) !important;
}

/* Settings sidebar nav items */
.sett-nav-item { border-radius: var(--r-md) !important; color: var(--v2-muted) !important; }
.sett-nav-item:hover { background: var(--v2-paper-2) !important; color: var(--v2-ink) !important; }
.sett-nav-item.active { background: var(--v2-accent-dim) !important; color: var(--v2-accent) !important; }

/* Avatar section — covers actual v1 class names */
.sett-avatar-section {
  display: flex !important; flex-direction: column !important;
  align-items: center !important; gap: 12px !important; margin-bottom: 28px !important;
}
.sett-avatar-img {
  width: 80px !important; height: 80px !important; border-radius: 50% !important;
  border: 3px solid var(--v2-border) !important; object-fit: cover !important;
}
.sett-avatar-initials {
  width: 80px !important; height: 80px !important; border-radius: 50% !important;
  border: 3px solid var(--v2-border) !important;
  background: var(--v2-paper-2) !important; color: var(--v2-mocha-dark) !important;
  font-family: var(--v2-font-d) !important; font-style: italic !important;
  font-size: 28px !important;
  display: flex !important; align-items: center !important; justify-content: center !important;
}
.sett-avatar-name { font-family: var(--v2-font-d) !important; font-size: 18px !important; color: var(--v2-ink) !important; }
.sett-avatar-username { color: var(--v2-muted) !important; }

/* Hint text + inline errors */
.sett-row-note, .sett-hint { font-size: 12px !important; color: var(--v2-muted) !important; }
.sett-error { color: var(--v2-danger) !important; font-size: 12.5px !important; }

/* Section dividers */
.sett-section { border-bottom-color: var(--v2-border) !important; }

/* Integration cards */
.sett-integration-card {
  border: 1px solid var(--v2-border) !important;
  border-radius: var(--r-md) !important;
  background: var(--v2-paper) !important;
}

/* Now playing widget in settings */
.now-playing-widget {
  background: var(--v2-paper) !important;
  border: 1px solid var(--v2-border) !important;
  border-radius: var(--r-md) !important;
}

/* Stats grid */
.stats-grid-v2 {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap: 12px; margin-bottom: 24px;
}
.stat-card-v2 {
  background: var(--v2-paper); border: 1px solid var(--v2-border); border-radius: var(--r-md);
  padding: 16px; box-shadow: var(--sh-xs);
}
.stat-card-v2 .stat-num { font-size: 26px; font-weight: 700; color: var(--v2-ink); font-family: var(--v2-font-d); }
.stat-card-v2 .stat-lbl { font-size: 11px; color: var(--v2-muted); font-family: var(--v2-font-m); text-transform: uppercase; letter-spacing: .06em; margin-top: 3px; }

/* Danger zone */
.danger-zone {
  border: 1px solid rgba(220,38,38,.25) !important;
  border-radius: var(--r-lg) !important;
  padding: 20px !important; margin-top: 32px !important;
  background: rgba(220,38,38,.04) !important;
}
.danger-zone h3 { color: var(--v2-danger) !important; font-size: 14px !important; margin: 0 0 8px !important; }
.settings-wrap .btn.danger, .settings-wrap button.danger {
  background: transparent !important; color: var(--v2-danger) !important;
  border: 1.5px solid rgba(220,38,38,.35) !important; border-radius: 22px !important;
  font-size: 14px !important; font-weight: 600 !important; padding: 9px 20px !important;
}
.settings-wrap .btn.danger:hover { background: rgba(220,38,38,.06) !important; }
</style>
</head>
<body class="v2 mobile">

<div id="nav-root" aria-hidden="true"></div>
<div id="modal-root"></div>

<input type="file" id="avatarInput" accept="image/*" style="display:none;">

<!-- Mobile bottom nav -->

<script src="../data.js"></script>
<script src="../app.js"></script>
<script src="v2-nav.js"></script>
<script>
  const wrap = document.getElementById("settingsWrap");
  const params = new URLSearchParams(location.search);
  const isBetaMode = () => !!(user && (
    (Array.isArray(user.badges) && user.badges.includes("tester")) ||
    (typeof _isBetaUser === "function" && _isBetaUser(user))
  ));
  let activeTab = (params.get("tab") === "settings" || params.get("spotify")) ? "settings" : params.get("tab") === "stats" ? "stats" : "profile";
  let activeSettingsTab = params.get("spotify") ? "integrations" : "profile";
  let user;

  const timezoneOptions = [
    { value: "America/Los_Angeles", label: "Pacific Time - US & Canada" },
    { value: "America/Denver",      label: "Mountain Time - US & Canada" },
    { value: "America/Chicago",     label: "Central Time - US & Canada" },
    { value: "America/New_York",    label: "Eastern Time - US & Canada" },
    { value: "America/Anchorage",   label: "Alaska Time - US & Canada" },
    { value: "Pacific/Honolulu",    label: "Hawaii Time - US & Canada" },
    { value: "Europe/London",       label: "London" },
    { value: "Europe/Berlin",       label: "Central Europe" },
    { value: "Asia/Tokyo",          label: "Tokyo" },
    { value: "Asia/Seoul",          label: "Seoul" },
    { value: "Asia/Kolkata",        label: "India" },
    { value: "Australia/Sydney",    label: "Sydney" },
    { value: "UTC",                 label: "UTC" }
  ];

  function getNotifPref(key) {
    try { const p = JSON.parse(localStorage.getItem("notifPrefs") || "{}"); return key in p ? p[key] : true; } catch { return true; }
  }
  function setNotifPref(key, val) {
    try { const p = JSON.parse(localStorage.getItem("notifPrefs") || "{}"); p[key] = val; localStorage.setItem("notifPrefs", JSON.stringify(p)); } catch {}
  }

  function wireToggleRow(switchId, handler) {
    const el = document.getElementById(switchId);
    if (!el) return;
    const row = el.closest(".sett-toggle-row") || el.parentElement;
    row.addEventListener("click", (e) => { e.preventDefault(); handler(el, e); });
  }

  function formatZonePreview(zone) {
    if (!zone) return "";
    try {
      return new Intl.DateTimeFormat(undefined, {
        month: "long", day: "numeric", year: "numeric",
        hour: "numeric", minute: "2-digit", timeZone: zone, timeZoneName: "short"
      }).format(new Date());
    } catch(e) { return zone; }
  }

  async function refreshNowPlaying() {
    const slot = document.getElementById("nowPlayingSlot");
    if (!slot || !user) return;
    const data = await fetchSpotifyNowPlaying(user.id).catch(() => null);
    const html = renderNowPlayingWidget(data);
    slot.innerHTML = html;
    slot.style.display = html ? "" : "none";
  }

  async function start() {
    const ready = initShell("profile");
    v2BootNav(ready);
    wrap.innerHTML = `<p style="color:var(--v2-muted);padding:40px 16px;font-size:14px;">Loading…</p>`;
    await ready.catch(() => {});
    user = Progress.getCurrentUser();
    if (!user) {
      wrap.innerHTML = `
        <div style="text-align:center;padding:80px 24px;">
          <p style="font-family:var(--v2-font-d);font-style:italic;font-size:24px;color:var(--v2-ink);margin-bottom:8px;">Log in to view your profile</p>
          <p style="color:var(--v2-muted);font-size:14px;">Use the account menu in the top right.</p>
        </div>`;
      return;
    }
    const spotifyStatus = params.get("spotify");
    if (spotifyStatus === "connected") { showToast("Spotify connected!"); activeSettingsTab = "integrations"; history.replaceState(null,"","profile.html?tab=settings"); }
    else if (spotifyStatus === "error") { showToast("Couldn't connect Spotify. Please try again."); activeSettingsTab = "integrations"; history.replaceState(null,"","profile.html?tab=settings"); }
    render();
    setInterval(refreshNowPlaying, 10000);
  }
  start();

  function render() {
    const myPosts = Progress.getPosts().filter(p => p.author === user.username);
    const hasBanner = isBetaMode() && user.bannerImage;
    wrap.innerHTML = `
      <h1 style="font-family:var(--v2-font-d);font-style:italic;font-size:28px;font-weight:600;color:var(--v2-ink);margin:0 0 24px;">Your account</h1>
      <div class="${hasBanner ? "has-banner" : ""}">
        ${hasBanner ? `<img class="profile-banner" src="${escapeHTML(user.bannerImage)}" alt="" draggable="false" style="width:100%;max-height:200px;object-fit:cover;border-radius:var(--r-lg);margin-bottom:20px;">` : ""}
        <div class="settings-avatar-row sett-avatar-section" style="display:flex;align-items:center;gap:16px;margin-bottom:28px;">
          ${user.avatar
            ? `<img class="sett-avatar-img" src="${user.avatar}" alt="" style="width:72px;height:72px;border-radius:50%;border:3px solid var(--v2-border);object-fit:cover;">`
            : `<div class="sett-avatar-initials" style="width:72px;height:72px;border-radius:50%;border:3px solid var(--v2-border);background:var(--v2-paper-2);display:flex;align-items:center;justify-content:center;font-family:var(--v2-font-d);font-style:italic;font-size:26px;color:var(--v2-mocha-dark);">${initials(user.name)}</div>`}
          <div>
            <div style="font-family:var(--v2-font-d);font-style:italic;font-size:19px;margin-bottom:4px;color:var(--v2-ink);">${user.name}${renderDisplayBadge(user)}</div>
            <div style="color:var(--v2-muted);font-size:13.5px;margin-bottom:8px;">@${user.username}</div>
            <div style="display:flex;gap:16px;font-size:13px;color:var(--v2-muted);margin-bottom:10px;">
              <span>${user.followers?.length || 0} followers</span>
              <span>${user.following?.length || 0} following</span>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="v2-btn v2-btn--ghost change-avatar-btn" id="changeAvatarBtn" style="font-size:13px;padding:7px 14px;">Change photo</button>
              <a class="v2-btn v2-btn--ghost" href="user.html?id=${user.id}" style="font-size:13px;padding:7px 14px;text-decoration:none;">View profile</a>
            </div>
          </div>
        </div>
      </div>

      <div class="settings-tabs" style="display:flex;gap:4px;border-bottom:1px solid var(--v2-border);margin-bottom:28px;overflow-x:auto;scrollbar-width:none;">
        <button class="settings-tab${activeTab === "profile"  ? " active" : ""}" data-tab="profile">Profile</button>
        <button class="settings-tab${activeTab === "stats"    ? " active" : ""}" data-tab="stats">Stats</button>
        <button class="settings-tab${activeTab === "settings" ? " active" : ""}" data-tab="settings">Settings</button>
      </div>
      <div id="tabContent"></div>
    `;

    document.getElementById("changeAvatarBtn").addEventListener("click", () => document.getElementById("avatarInput").click());
    document.querySelectorAll(".settings-tab").forEach(btn => {
      btn.addEventListener("click", () => {
        activeTab = btn.dataset.tab;
        history.replaceState(null, "", "profile.html?tab=" + activeTab);
        render();
      });
    });

    const content = document.getElementById("tabContent");

    if (activeTab === "profile") {
      content.innerHTML = `
        <div id="nowPlayingSlot" style="max-width:360px;margin-bottom:16px;"></div>
        <div class="sett-section">
          <div class="sett-section-title">Joined</div>
          <p style="margin:0;font-size:14px;color:var(--v2-ink);">${Progress.formatDate(user.joined || "Unknown")}</p>
        </div>
        <div class="sett-section">
          <div class="sett-section-title">Streak</div>
          ${(user.streak && user.streak > 0)
            ? `<p style="margin:0;font-size:15px;">🔥 <strong>${user.streak}</strong> day${user.streak === 1 ? "" : "s"} in a row</p>`
            : `<p style="margin:0;color:var(--v2-muted);font-size:14px;">No active streak — log in daily to build one.</p>`}
        </div>
        <div class="sett-section">
          <div class="sett-section-title">Bio</div>
          <div class="bio-text" style="font-size:14.5px;line-height:1.6;">${user.bio ? renderEmoticonsText(user.bio, "bio-emoticon") : `<span style="color:var(--v2-muted);">No bio yet.</span>`}</div>
        </div>
        ${user.spotify ? `
        <div class="sett-section">
          <div class="sett-section-title">Featured track</div>
          ${renderSpotifyEmbed(user)}
        </div>` : ""}
        <div class="sett-section">
          <div class="sett-section-title">Timezone</div>
          <p style="margin:0;font-size:14px;">${user.timezone || Progress.getTimeZone()}</p>
        </div>
        <div class="sett-section">
          <div class="sett-section-title">Badges</div>
          ${user.badges && user.badges.length ? renderBadgeDetails(user) : `<p style="color:var(--v2-muted);font-size:14px;">No badges earned yet.</p>`}
        </div>
        <div class="sett-section" id="bookmarksSection">
          <div class="sett-section-title">Bookmarks</div>
          <p style="color:var(--v2-muted);font-size:14px;">Loading…</p>
        </div>
        <div class="sett-section" style="border-bottom:none;">
          <div class="sett-section-title">Entries (${myPosts.length})</div>
          ${myPosts.length ? myPosts.map(p => `
            <a href="post.html?id=${p.id}" style="display:block;padding:12px 0;border-bottom:1px solid var(--v2-border);font-size:14.5px;text-decoration:none;color:inherit;">
              <span style="font-family:var(--v2-font-m);font-size:11px;color:var(--v2-muted);text-transform:uppercase;margin-right:10px;">${Progress.formatDateShort(p.date)}</span>
              ${p.title}

    } else if (activeTab === "stats") {
      content.innerHTML = `<div style="padding-top:12px;"><p style="color:var(--v2-muted);font-size:14px;">Loading your stats…</p></div>`;
      apiFetch(`/api/users/${user.username}/stats`).then(s => {
        if (!s) { content.innerHTML = `<div style="padding-top:12px;"><p style="color:var(--v2-muted);font-size:14px;">Couldn't load stats.</p></div>`; return; }
        const fmt = n => n >= 1000 ? (n/1000).toFixed(1).replace(/\.0$/,"")+"k" : String(n);
        const statCard = (num, label) => `
          <div class="stat-card-v2">
            <div class="stat-num">${fmt(num)}</div>
            <div class="stat-lbl">${label}</div>
          </div>`;
        function buildHeatmap(postsByDay) {
          const C=11, G=3;
          const today = new Date(); today.setHours(0,0,0,0);
          const start = new Date(today); start.setDate(start.getDate()-364);
          start.setDate(start.getDate()-start.getDay());
          const lvl = n => { if(n<=0) return "var(--v2-border)"; if(n===1) return "#C8A87E"; if(n===2) return "#A9866D"; return "#7A5840"; };
          const weeks=[]; const cur=new Date(start);
          while(cur<=today){ const week=[];
            for(let d=0;d<7;d++){
              const ds=cur.toISOString().slice(0,10);
              week.push({ds,count:cur<=today?(postsByDay[ds]||0):-1,month:cur.getDate()===1?cur.toLocaleString("en-US",{month:"short"}):""});
              cur.setDate(cur.getDate()+1);
            } weeks.push(week); }
          const monthRow=weeks.map(w=>{const m=w.find(d=>d.month);return `<div style="width:${C}px;overflow:visible;white-space:nowrap;font-size:9px;color:var(--v2-muted);text-transform:uppercase;">${m?m.month:""}</div>`;}).join("");
          const grid=weeks.map(w=>`<div style="display:flex;flex-direction:column;gap:${G}px;">`+w.map(d=>d.count<0?`<div style="width:${C}px;height:${C}px;"></div>`:`<div style="width:${C}px;height:${C}px;border-radius:2px;background:${lvl(d.count)};cursor:default;" title="${d.ds}${d.count?" · "+d.count+" post"+(d.count>1?"s":""):""}"></div>`).join("")+"</div>").join("");
          return `<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;"><div style="display:inline-flex;flex-direction:column;gap:${G}px;"><div style="display:flex;gap:${G}px;">${monthRow}</div><div style="display:flex;gap:${G}px;">${grid}</div></div></div>`;
        }
        content.innerHTML = `
          <div style="padding-top:12px;">
            <div class="stats-grid-v2" style="margin-bottom:16px;">
              ${statCard(s.totalPosts,"posts published")}${statCard(s.totalWords,"words written")}
              ${statCard(s.totalLikes,"likes received")}${statCard(s.followers,"followers")}
            </div>
            <div style="background:var(--v2-paper);border:1px solid var(--v2-border);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:16px;display:flex;align-items:stretch;box-shadow:var(--sh-xs);">
              <div style="flex:1;text-align:center;">
                <span style="display:block;font-size:28px;font-weight:700;color:var(--v2-ink);font-family:var(--v2-font-d);line-height:1;margin-bottom:6px;">${user.streak||0}</span>
                <span style="font-size:10px;color:var(--v2-muted);text-transform:uppercase;letter-spacing:.1em;font-family:var(--v2-font-m);">current streak</span>
              </div>
              <div style="width:1px;background:var(--v2-border);margin:0 20px;"></div>
              <div style="flex:1;text-align:center;">
                <span style="display:block;font-size:28px;font-weight:700;color:var(--v2-ink);font-family:var(--v2-font-d);line-height:1;margin-bottom:6px;">${s.longestStreak}</span>
                <span style="font-size:10px;color:var(--v2-muted);text-transform:uppercase;letter-spacing:.1em;font-family:var(--v2-font-m);">longest streak</span>
              </div>
            </div>
            <div class="sett-section">
              <div class="sett-section-title">Writing days — last year</div>
              ${buildHeatmap(s.postsByDay||{})}
              <div style="display:flex;align-items:center;gap:6px;margin-top:10px;">
                <span style="font-size:10px;color:var(--v2-muted);">less</span>
                ${["var(--v2-border)","#C8A87E","#A9866D","#7A5840"].map(c=>`<div style="width:11px;height:11px;border-radius:2px;background:${c};"></div>`).join("")}
                <span style="font-size:10px;color:var(--v2-muted);">more</span>
              </div>
            </div>
            ${s.topPost ? `
            <div class="sett-section" style="border-bottom:none;">
              <div class="sett-section-title">Best post</div>
              <a href="post.html?id=${s.topPost.id}" style="display:block;padding:14px 16px;background:var(--v2-paper-2);border:1px solid var(--v2-border);border-radius:var(--r-md);text-decoration:none;color:inherit;">
                <p style="margin:0 0 5px;font-size:15px;font-weight:600;color:var(--v2-ink);line-height:1.3;">${s.topPost.title||"Untitled"}</p>
                <p style="margin:0;font-size:12px;color:var(--v2-muted);">♡ ${s.topPost.likes} like${s.topPost.likes!==1?"s":""}</p>
              </a>
            </div>` : ""}
          </div>`;
      }).catch(() => {
        content.innerHTML = `<div style="padding-top:12px;"><p style="color:var(--v2-muted);font-size:14px;">Couldn't load stats.</p></div>`;
      });

    } else {
      const SETT_TABS = [
        { id:"profile",       label:"Profile",       icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>` },
        { id:"account",       label:"Account",       icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>` },
        { id:"notifications", label:"Notifications", icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>` },
        { id:"appearance",    label:"Appearance",    icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>` },
        { id:"privacy",       label:"Privacy",       icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>` },
        { id:"integrations",  label:"Integrations",  icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>` },
        { id:"beta",          label:"Beta",          icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2v-4M9 21H5a2 2 0 0 1-2-2v-4m0 0h18"/></svg>` },
      ];
      content.innerHTML = `<div class="sett-layout sett-layout--inline"><nav class="sett-nav" id="settSubNav"></nav><div class="sett-panel" id="settSubPanel"></div></div>`;

      function renderSubNav() {
        const nav = document.getElementById("settSubNav");
        if (!nav) return;
        nav.innerHTML = SETT_TABS.map(t => `<button class="sett-nav-item${activeSettingsTab===t.id?" active":""}" data-tab="${t.id}">${t.icon}<span>${t.label}</span></button>`).join("");
        nav.querySelectorAll(".sett-nav-item").forEach(btn => {
          btn.addEventListener("click", () => { activeSettingsTab=btn.dataset.tab; renderSubNav(); renderSubPanel(); });
        });
      }
      function renderSubPanel() {
        const panel = document.getElementById("settSubPanel");

        switch(activeSettingsTab) {
          case "profile":       renderSubProfile(panel); break;
          case "account":       renderSubAccount(panel); break;
          case "notifications": renderSubNotifications(panel); break;
          case "appearance":    renderSubAppearance(panel); break;
          case "privacy":       renderSubPrivacy(panel); break;
          case "integrations":  renderSubIntegrations(panel); break;
          case "beta":          renderSubBeta(panel); break;
          default:              renderSubProfile(panel);
        }
      }

      function renderSubProfile(panel) {
        const betaOn = isBetaMode();
        panel.innerHTML = `
          <h2 class="sett-panel-title">Profile</h2>
          ${betaOn ? `

            <p style="font-size:13.5px;color:var(--v2-muted);margin-bottom:12px;">A cover image shown at the top of your public profile.</p>
            <div id="bannerPreviewWrap" style="margin-bottom:12px;">${user.bannerImage?`<img src="${escapeHTML(user.bannerImage)}" style="width:100%;max-height:160px;object-fit:cover;border-radius:var(--r-lg);display:block;">`:`<div style="width:100%;height:100px;background:var(--v2-paper-2);border:1px dashed var(--v2-border);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;color:var(--v2-muted);font-size:13px;">No banner set</div>`}</div>

          </div>` : ""}
          <div class="sett-field-group">

              <textarea class="sett-textarea" id="bioField" rows="4" placeholder="Tell people about yourself…">${escapeHTML(user.bio||"")}</textarea>
              <div class="emoji-picker" id="profileEmojiPicker" style="margin-top:8px;"></div>
              <span class="sett-row-note">Use <code>:computer:</code>, <code>:dead:</code> for custom emoticons.</span>
            </div>
            <div class="sett-field">
              <label class="sett-label">Timezone</label>
              <select class="sett-input" id="timezoneField">
                ${timezoneOptions.map(o=>`<option value="${o.value}"${user.timezone===o.value?" selected":""}>${o.label}</option>`).join("")}
              </select>

            </div>
            <div class="sett-field">
              <label class="sett-label">Featured Spotify link</label>
              <input class="sett-input" id="spotifyField" placeholder="Paste a Spotify track, album, playlist, or artist link" value="${escapeHTML(user.spotify||"")}">
              <span class="sett-row-note">Right-click a song → Share → Copy Link. Shows as a mini player on your profile.</span>
              <div id="spotifyPreview" style="margin-top:10px;">${renderSpotifyEmbed(user)}</div>
            </div>
          </div>
          <button class="v2-btn v2-btn--dark" id="saveProfileBtn" style="font-size:14px;padding:10px 24px;">Save changes</button>
        `;
        // Emoji picker
        const picker = document.getElementById("profileEmojiPicker");
        if (picker) {
          picker.innerHTML = getEmoticonNames().map(n=>`<button type="button" class="emoji-btn" data-name="${n}"><img src="../images/emoticons/${n}.png" alt="${n}"></button>`).join("");
          picker.querySelectorAll(".emoji-btn").forEach(btn => {
            btn.addEventListener("click", () => {
              const ta=document.getElementById("bioField"); if(!ta) return;
              const ph=`:${btn.dataset.name}:`,s=ta.selectionStart,e=ta.selectionEnd;
              ta.value=ta.value.slice(0,s)+ph+ta.value.slice(e); ta.focus(); ta.selectionStart=ta.selectionEnd=s+ph.length;
            });
          });
        }
        document.getElementById("timezoneField").addEventListener("change",e=>{ document.getElementById("timezonePreview").textContent=formatZonePreview(e.target.value); });
        let spTimer;
        document.getElementById("spotifyField").addEventListener("input",e=>{
          clearTimeout(spTimer); spTimer=setTimeout(()=>{
            const val=e.target.value.trim(); const preview=document.getElementById("spotifyPreview");
            if(!val){preview.innerHTML="";return;}
            const embed=renderSpotifyEmbed({spotify:val});
            preview.innerHTML=embed||`<p class="sett-row-note" style="color:var(--v2-danger);">That doesn't look like a Spotify link yet.</p>`;
          },400);
        });
        document.getElementById("saveProfileBtn").addEventListener("click",async()=>{
          const name=document.getElementById("nameField").value.trim();
          const bio=document.getElementById("bioField").value.trim();
          const timezone=document.getElementById("timezoneField").value;
          const spotify=document.getElementById("spotifyField").value.trim();
          if(!name){showToast("Display name can't be empty.");return;}
          if(spotify&&!spotifyEmbedUrl(spotify)){showToast("That doesn't look like a valid Spotify link.");return;}
          const btn=document.getElementById("saveProfileBtn");
          btn.disabled=true;btn.textContent="Saving…";
          const updated=await Progress.updateProfile({name,bio,timezone,spotify});
          btn.disabled=false;btn.textContent="Save changes";
          if(updated){user=Progress.getCurrentUser()||user;showToast("Saved.");}
          else showToast("Could not save. Try again.");
        });
        // Banner (beta)
        const changeBannerBtn=document.getElementById("changeBannerBtn");
        const bannerInput=document.getElementById("bannerInput");
        const removeBannerBtn=document.getElementById("removeBannerBtn");
        if(changeBannerBtn&&bannerInput){
          changeBannerBtn.addEventListener("click",()=>bannerInput.click());
          bannerInput.addEventListener("change",async()=>{
            const file=bannerInput.files[0]; if(!file) return;
            if(file.size>6*1024*1024){showToast("Banner image must be under 6 MB.");return;}
            const reader=new FileReader();
            reader.onload=async(e)=>{
              const base64=e.target.result;
              const preview=document.getElementById("bannerPreviewWrap");
              if(preview) preview.innerHTML=`<img src="${base64}" style="width:100%;max-height:160px;object-fit:cover;border-radius:var(--r-lg);display:block;">`;

      function renderSubAccount(panel) {
        const emailVal=escapeHTML(user.email||localStorage.getItem("progress:myEmail")||"");
        const emailOn=user.emailNotifications!==false&&!!user.email;
        panel.innerHTML=`
          <h2 class="sett-panel-title">Account</h2>
          <div class="sett-section">
            <div class="sett-section-title">Email address</div>
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">

        document.getElementById("saveEmailBtn").addEventListener("click",async()=>{

        document.getElementById("changePassBtn").addEventListener("click",async()=>{
          const current=document.getElementById("currentPassField").value;
          const next=document.getElementById("newPassField").value;
          const confirm=document.getElementById("confirmPassField").value;
          if(!current||!next){showToast("Fill in both password fields.");return;}
          if(next!==confirm){showToast("New passwords don't match.");return;}
          if(next===current){showToast("New password must be different from current.");return;}
          const passwordError=Progress.validatePassword?Progress.validatePassword(next):null;
          if(passwordError){showToast(passwordError);return;}
          const btn=document.getElementById("changePassBtn");btn.disabled=true;btn.textContent="Saving…";
          try{
            const res=await apiFetch("/api/account/password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({currentPassword:current,newPassword:next})});
            if(res&&res.ok!==false){showToast("Password changed.");document.getElementById("currentPassField").value="";document.getElementById("newPassField").value="";document.getElementById("confirmPassField").value="";}
            else showToast(res?.error||"Incorrect current password.");
          }catch(e){showToast("Could not change password.");}
          btn.disabled=false;btn.textContent="Change password";
        });
        document.getElementById("deleteAccountBtn").addEventListener("click",async()=>{
          if(!confirm("This will permanently delete your account and all your posts.")) return;
          const confirmText=prompt("Type 'delete' to confirm:");
          if(confirmText!=="delete"){showToast("Cancelled.");return;}
          showToast("Deleting account…");
          const deleted=await Progress.deleteAccount();
          if(deleted){showToast("Account deleted.");setTimeout(()=>location.href="index.html",500);}
          else showToast("Could not delete account.");
        });
      }

      function renderSubNotifications(panel) {

          <div class="sett-section">
            <div class="sett-section-title">Email</div>
            <label class="sett-toggle-row">
              <span class="theme-toggle-switch${emailOn?" on":""}" id="notifEmailToggle" data-on="${emailOn?"1":"0"}"><span class="theme-toggle-knob"></span></span>
              <span>Email notifications${!user.email?`<span class="sett-row-note">Add an email in Account settings first.</span>`:""}
            </label>
          </div>
          <div class="sett-section">
            <div class="sett-section-title">Browser</div>
            <label class="sett-toggle-row">
              <span class="theme-toggle-switch${pushOn?" on":""}" id="notifPushToggle" data-on="${pushOn?"1":"0"}"><span class="theme-toggle-knob"></span></span>
              <span>Browser push notifications<span class="sett-row-note" id="pushNote">Get a popup for likes, replies, follows, and messages.</span></span>
            </label>
          </div>
          <div class="sett-section">
            <div class="sett-section-title">Chat</div>
            <label class="sett-toggle-row">
              <span class="theme-toggle-switch${getChatSoundEnabled()?" on":""}" id="chatSoundToggle" data-on="${getChatSoundEnabled()?"1":"0"}"><span class="theme-toggle-knob"></span></span>
              <span>Chat sounds<span class="sett-row-note">Play a sound when new messages arrive.</span></span>
            </label>
            <label class="sett-toggle-row">
              <span class="theme-toggle-switch${getChatNotificationsEnabled()?" on":""}" id="chatAlertToggle" data-on="${getChatNotificationsEnabled()?"1":"0"}"><span class="theme-toggle-knob"></span></span>
              <span>Chat alerts<span class="sett-row-note">Browser notifications for new messages.</span></span>
            </label>
          </div>
          <div class="sett-section" style="border-bottom:none;">
            <div class="sett-section-title">Per-type controls</div>
            ${[["notif-likes","Likes","When someone likes your post"],["notif-comments","Comments","When someone replies to you"],["notif-follows","Follows","When someone follows you"],["notif-mentions","Community mentions","@mentions in community chat"],["notif-reactions","Reactions","When someone reacts to your message"],["notif-events","Event alerts","Score saves and leaderboard news"]].map(([key,label,note])=>{
              const on=getNotifPref(key);
              return `<label class="sett-toggle-row"><span class="theme-toggle-switch${on?" on":""}" id="${key}Toggle" data-key="${key}" data-on="${on?"1":"0"}"><span class="theme-toggle-knob"></span></span><span>${label}<span class="sett-row-note">${note}</span></span></label>`;
            }).join("")}
          </div>
        `;
        wireToggleRow("chatSoundToggle",(el)=>{const on=el.dataset.on!=="1";el.dataset.on=on?"1":"0";el.classList.toggle("on",on);setChatSoundEnabled(on);showToast(on?"Chat sounds enabled.":"Chat sounds disabled.");});
        wireToggleRow("chatAlertToggle",async(el)=>{
          const on=el.dataset.on!=="1";
          if(!on){el.dataset.on="0";el.classList.remove("on");setChatNotificationsEnabled(false);showToast("Chat alerts disabled.");return;}
          const granted=await requestNotificationPermission();
          el.dataset.on=granted?"1":"0";el.classList.toggle("on",granted);setChatNotificationsEnabled(granted);
          if(granted)showToast("Chat alerts enabled.");else showToast("Notifications blocked. Allow them in browser settings.");
        });
        panel.querySelectorAll("[id$='Toggle'][data-key]").forEach(el=>{
          const row=el.closest(".sett-toggle-row")||el.parentElement;
          row.addEventListener("click",(e)=>{e.preventDefault();const on=el.dataset.on!=="1";el.dataset.on=on?"1":"0";el.classList.toggle("on",on);setNotifPref(el.dataset.key,on);showToast(on?"Turned on.":"Turned off.");});
        });
        wireToggleRow("notifEmailToggle",async(el)=>{
          if(el.dataset.on!=="1"&&!user.email){showToast("Add an email address first.");return;}
          const on=el.dataset.on!=="1";el.dataset.on=on?"1":"0";el.classList.toggle("on",on);
          await Progress.updateProfile({emailNotifications:on});showToast(on?"Email notifications on.":"Email notifications off.");
        });
        wireToggleRow("notifPushToggle",async(el)=>{
          const noteEl=document.getElementById("pushNote");const turningOn=el.dataset.on!=="1";
          if(!turningOn){el.dataset.on="0";el.classList.remove("on");setNotificationOptIn(false);return;}
          if(!("Notification" in window)){if(noteEl)noteEl.textContent="Your browser doesn't support notifications.";return;}
          const granted=await requestNotificationPermission();
          el.dataset.on=granted?"1":"0";el.classList.toggle("on",granted);
          if(!granted&&noteEl)noteEl.textContent="Notifications are blocked — allow them in your browser settings.";

      }

        wireToggleRow("chatCompactToggle",(el)=>{const on=el.dataset.on!=="1";el.dataset.on=on?"1":"0";el.classList.toggle("on",on);setChatCompactMode(on);applyChatPreferences();showToast(on?"Compact mode on.":"Compact mode off.");});

                <svg viewBox="0 0 24 24" fill="#fff" width="22" height="22"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.484 17.316a.747.747 0 0 1-1.028.249c-2.815-1.72-6.358-2.109-10.529-1.156a.748.748 0 0 1-.352-1.452c4.564-1.045 8.477-.595 11.661 1.331a.748.748 0 0 1 .248 1.028zm1.464-3.261a.934.934 0 0 1-1.284.308c-3.222-1.98-8.133-2.553-11.944-1.397a.934.934 0 0 1-.583-1.777c4.354-1.295 9.765-.668 13.504 1.593a.934.934 0 0 1 .307 1.273zm.126-3.397c-3.867-2.297-10.241-2.508-13.934-1.387a1.12 1.12 0 1 1-.649-2.144c4.245-1.286 11.293-1.038 15.748 1.605a1.12 1.12 0 1 1-1.165 1.926z"/></svg>
              </div>
              <div style="flex:1;min-width:0;">
                <div style="font-weight:600;font-size:14.5px;color:var(--v2-ink);margin-bottom:4px;">Spotify</div>

                ${spConnected?`<button class="v2-btn v2-btn--ghost" id="disconnectSpotifyBtn" style="font-size:13px;padding:7px 14px;color:var(--v2-danger);border-color:rgba(220,38,38,.35);">Disconnect</button>`:`<button class="v2-btn v2-btn--ghost" id="connectSpotifyBtn" style="font-size:13px;padding:7px 14px;">Connect Spotify</button>`}

            <div class="sett-integration-card" style="display:flex;gap:16px;padding:16px;border:1px solid var(--v2-border);border-radius:var(--r-md);background:var(--v2-paper);opacity:.55;pointer-events:none;user-select:none;">

                <svg viewBox="0 0 24 24" fill="#c6d4df" width="22" height="22"><path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.187.006l2.861-4.142V8.91c0-2.495 2.028-4.524 4.524-4.524 2.494 0 4.524 2.029 4.524 4.524s-2.03 4.525-4.524 4.525h-.105l-4.076 2.911c0 .052.004.105.004.159 0 1.875-1.515 3.396-3.39 3.396-1.635 0-3.016-1.173-3.331-2.718L.436 15.27C1.862 20.307 6.486 24 11.979 24c6.627 0 11.999-5.373 11.999-12S18.606 0 11.979 0z"/></svg>

              <div><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;"><span style="font-weight:600;font-size:14.5px;color:var(--v2-ink);">Steam</span><span style="font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:var(--v2-paper-2);color:var(--v2-muted);border-radius:6px;padding:2px 6px;">Coming Soon</span></div>

      renderSubNav();
      renderSubPanel();
    }

    attachBadgeTooltip(wrap);
    attachBadgeClick(wrap);
  }

  function attachBadgeClick(root) {
    if (!root) return;
    root.querySelectorAll(".profile-badge").forEach(el => {
      el.addEventListener("click", async () => {
        const badgeId=el.dataset.badgeId; if(!badgeId) return;
        if(badgeId==="dexterity"){showToast("This badge can't be displayed on display name.");return;}
        const isActive=user.displayBadge===badgeId;const nextBadge=isActive?null:badgeId;
        el.style.opacity="0.45";el.style.pointerEvents="none";
        const payload=await apiFetch(`/api/users/${user.id}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({displayBadge:nextBadge})});
        el.style.opacity="";el.style.pointerEvents="";
        if(!payload){showToast("Couldn't save badge — please try again.");return;}
        const localUser=Progress.db.users.find(u=>u.username===user.username);
        if(localUser){const preserved={email:localUser.email};Object.assign(localUser,payload,preserved);Progress.persist();}
        user=Progress.getCurrentUser()||user;render();
        showToast(isActive?`Removed ${BADGES[badgeId]?.label??badgeId} from your name.`:`Displaying ${BADGES[badgeId]?.label??badgeId} on your name.`);
      });
    });
  }

  document.getElementById("avatarInput").addEventListener("change", () => {
    const file=document.getElementById("avatarInput").files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=async()=>{await Progress.updateProfile({avatar:reader.result});showToast("Photo updated.");setTimeout(()=>location.reload(),400);};
    reader.readAsDataURL(file);
  });

</script>
