<script src="../data.js"></script>
<script src="../app.js"></script>
<script src="v2-nav.js"></script>
<script>
/* ── V2 Feed — constants ──────────────────────────────────── */
const V2_READ_KEY  = "progress:readPosts";
const V2_CAT_KEY   = "progress:activeCategory";

/* ── Helpers ──────────────────────────────────────────────── */
function v2GetRead() {
  try { return new Set(JSON.parse(localStorage.getItem(V2_READ_KEY) || "[]")); } catch { return new Set(); }
}

function v2MarkRead(id) {
  try {
    const s = v2GetRead();
    s.add(id);
    localStorage.setItem(V2_READ_KEY, JSON.stringify([...s].slice(-500)));
  } catch {}
}

let v2ActiveCat = localStorage.getItem(V2_CAT_KEY) || "all";

function v2SetCat(cat) {
  v2ActiveCat = cat;
  try { localStorage.setItem(V2_CAT_KEY, cat); } catch {}
}

function v2InitTabs() {
  const tabs = document.querySelectorAll(".v2-tab");
  tabs.forEach(btn => {
    const isActive = btn.dataset.cat === v2ActiveCat;
    btn.classList.toggle("active", isActive);
    btn.setAttribute("aria-selected", String(isActive));
    btn.addEventListener("click", () => {
      v2SetCat(btn.dataset.cat);
      tabs.forEach(t => {
        t.classList.toggle("active", t.dataset.cat === v2ActiveCat);
        t.setAttribute("aria-selected", String(t.dataset.cat === v2ActiveCat));
      });
      v2RenderFeed();
    });
  });
}

function v2FilterCat(cat) {
  v2SetCat(cat);
  document.querySelectorAll(".v2-tab").forEach(t => {
    t.classList.toggle("active", t.dataset.cat === cat);
    t.setAttribute("aria-selected", String(t.dataset.cat === cat));
  });
  v2RenderFeed();
  // Scroll feed into view on mobile
  document.getElementById("v2Feed").scrollIntoView({ behavior: "smooth", block: "start" });
}

/* ── Avatar helper ────────────────────────────────────────── */
function v2AvatarEl(user, size = 22) {
  const cls = "v2-card-av";
  if (!user) {
    return `<div class="${cls}" style="width:${size}px;height:${size}px;">?</div>`;
  }
  if (user.avatar) {
    return `<div class="${cls}" style="width:${size}px;height:${size}px;"><img src="${escapeHTML(user.avatar)}" alt="@${escapeHTML(user.username)}" loading="lazy"></div>`;
  }
  const initials = (user.name || user.username).split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
  return `<div class="${cls}" style="width:${size}px;height:${size}px;font-size:${Math.floor(size * .38)}px;">${initials}</div>`;
}

/* ── Card HTML builder ────────────────────────────────────── */
function v2CardHTML(post, isFeat, readSet) {
  const author = Progress.getUser(post.author);
  const isRead = readSet.has(post.id);
  const catSlug = (post.category || "").toLowerCase();
  const catLabel = catSlug ? catSlug.charAt(0).toUpperCase() + catSlug.slice(1) : "";
  const catChip = catLabel
    ? `<span class="v2-card-cat cat-${catSlug}"><span class="v2-card-cat-dot"></span>${catLabel}</span>`
    : "";
  const dateStr = Progress.formatDateShort(post.date);
  const title = renderEmoticonsText ? renderEmoticonsText(post.title, "inline-emoticon") : escapeHTML(post.title);
  const excerpt = renderEmoticonsText ? renderEmoticonsText(post.excerpt, "inline-emoticon") : escapeHTML(post.excerpt);
  const av = v2AvatarEl(author, isFeat ? 24 : 22);

  if (isFeat) {
    const imgWrap = post.cover
      ? `<div class="v2-feat-img-wrap"><img class="v2-card-cover" src="${escapeHTML(post.cover)}" alt="" loading="lazy"></div>`
      : `<div class="v2-feat-img-wrap"><div class="v2-feat-gradient">${post.emoji || "✍️"}</div></div>`;

    return `
    <article class="v2-card v2-card--feat${isRead ? " v2-read" : ""}" data-id="${post.id}" data-href="post.html?id=${post.id}" tabindex="0" role="article">
      ${imgWrap}
      <div class="v2-card-body">
        <div class="v2-feat-eyebrow">Featured</div>
        <div class="v2-card-meta">
          ${catChip}
          <span class="v2-card-date">${dateStr}</span>
        </div>
        <h2 class="v2-card-title">${title}</h2>
        <p class="v2-card-excerpt">${excerpt}</p>
        <div class="v2-card-footer">
          ${av}
          <span class="v2-card-author">@${escapeHTML(post.author)}</span>
          <span class="v2-card-likes">
            <svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M6 10.5S1 7.2 1 4.2C1 2.4 2.4 1 4.2 1c.9 0 1.8.5 2.8 1.6C8-.5 9.4 1 9.8 1c1.8 0 3.2 1.4 1.2 3.2C9 7.2 6 10.5 6 10.5Z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>
            ${post.likes || 0}
          </span>
        </div>
      </div>
    </article>`;
  }

  const imgEl = post.cover
    ? `<img class="v2-card-cover" src="${escapeHTML(post.cover)}" alt="" loading="lazy">`
    : "";

  return `
  <article class="v2-card${isRead ? " v2-read" : ""}" data-id="${post.id}" data-href="post.html?id=${post.id}" tabindex="0" role="article">
    ${imgEl}
    <div class="v2-card-body">
      <div class="v2-card-meta">
        ${catChip}
        <span class="v2-card-date">${dateStr}</span>
      </div>
      <h2 class="v2-card-title">${title}</h2>
      <p class="v2-card-excerpt">${excerpt}</p>
      <div class="v2-card-footer">
        ${av}
        <span class="v2-card-author">@${escapeHTML(post.author)}</span>
        <span class="v2-card-likes">
          <svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M6 10.5S1 7.2 1 4.2C1 2.4 2.4 1 4.2 1c.9 0 1.8.5 2.8 1.6C8-.5 9.4 1 9.8 1c1.8 0 3.2 1.4 1.2 3.2C9 7.2 6 10.5 6 10.5Z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>
          ${post.likes || 0}
        </span>
      </div>
    </div>
  </article>`;
}

/* ── Render feed ──────────────────────────────────────────── */
function v2RenderFeed() {
  let posts = Progress.getPosts();
  const feed = document.getElementById("v2Feed");

  // Category filter
  if (v2ActiveCat && v2ActiveCat !== "all") {
    if (v2ActiveCat === "following") {
      const me = Progress.getCurrentUser();
      const fl = (me && me.following) ? me.following : [];
      posts = posts.filter(p => fl.includes(p.author));
    } else {
      posts = posts.filter(p => (p.category || "").toLowerCase() === v2ActiveCat);
    }
  }

  if (!posts.length) {
    feed.innerHTML = `
      <div class="v2-empty">
        <h3>${v2ActiveCat === "following" ? "No posts from people you follow yet" : "Nothing here yet"}</h3>
        <p>${v2ActiveCat === "following" ? "Follow some writers and their posts will show up here." : "The first entry is always the hardest one to publish."}</p>
      </div>`;
    return;
  }

  const readSet = v2GetRead();
  const [first, ...rest] = posts;
  const featHTML = v2CardHTML(first, true, readSet);
  const restHTML = rest.map(p => v2CardHTML(p, false, readSet)).join("");

  feed.innerHTML = `
    ${featHTML}
    ${rest.length ? `<div class="v2-grid">${restHTML}</div>` : ""}`;

  // Wire click handlers
  feed.querySelectorAll(".v2-card").forEach(card => {
    card.addEventListener("click", e => {
      if (e.target.closest("a")) return;
      const href = card.dataset.href;
      if (href) {
        v2MarkRead(card.dataset.id);
        card.classList.add("v2-read");
        location.href = href;
      }
    });
    card.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); card.click(); }
    });
  });
}

/* ── Nav scroll shadow ─────────────────────────────────────── */
window.addEventListener("scroll", () => {
  document.getElementById("v2Nav").classList.toggle("scrolled", window.scrollY > 10);
}, { passive: true });

/* ── Right sidebar: trending writers ──────────────────────── */
function v2RenderTrending() {
  const posts = Progress.getPosts();
  const counts = {};
  posts.forEach(p => { counts[p.author] = (counts[p.author] || 0) + 1; });
  const top = Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5)
    .map(([username]) => username);

  const list = document.getElementById("v2TrendingList");
  if (!list || !top.length) return;

  list.innerHTML = top.map(username => {
    const user = Progress.getUser(username);
    const postCount = counts[username];
    let avHTML;
    if (user && user.avatar) {
      avHTML = `<img src="${escapeHTML(user.avatar)}" alt="@${escapeHTML(username)}" loading="lazy">`;
    } else {
      const ini = (user ? (user.name || username) : username).split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
      avHTML = ini;
    }
    return `
      <a href="user.html?id=${escapeHTML(username)}" class="v2-trending-user">
        <div class="v2-trending-av">${avHTML}</div>
        <div class="v2-trending-info">
          <div class="v2-trending-name">@${escapeHTML(username)}</div>
          <div class="v2-trending-posts">${postCount} post${postCount !== 1 ? "s" : ""}</div>
        </div>
      </a>`;
  }).join("");
}

/* ── Left sidebar: user card ──────────────────────────────── */
function v2RenderUserCard() {
  const me = Progress.getCurrentUser();
  const card = document.getElementById("v2UserCard");
  const sideProfile = document.getElementById("v2SideProfile");
  const joinBtn = document.getElementById("v2JoinBtn");
  const streakBox = document.getElementById("v2StreakBox");

  if (!me) {
    if (joinBtn) joinBtn.style.display = "";
    return;
  }

  if (sideProfile) sideProfile.style.display = "";
  if (joinBtn) joinBtn.style.display = "none";

  const ini = (me.name || me.username).split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
  const avHTML = me.avatar
    ? `<img src="${escapeHTML(me.avatar)}" alt="" loading="lazy">`
    : ini;

  if (card) {
    card.innerHTML = `
      <div class="v2-user-card">
        <div class="v2-user-card-av">${avHTML}</div>
        <div class="v2-user-card-name">${escapeHTML(me.name || me.username)}</div>
        <div class="v2-user-card-handle">@${escapeHTML(me.username)}</div>
      </div>`;
  }

  // Streak
  if (streakBox && me.streak >= 2) {
    streakBox.style.display = "block";
    streakBox.innerHTML = `
      <div style="background:var(--v2-paper);border:1px solid var(--v2-border);border-radius:var(--r-md);padding:13px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh-xs);">
        <span style="font-size:22px;">🔥</span>
        <div>
          <div style="font-weight:700;font-size:13.5px;color:var(--v2-ink);">${me.streak}-day streak</div>
          <div style="font-size:11.5px;color:var(--v2-muted);">Keep it going!</div>
        </div>
      </div>`;
  }

  // Nav right: replace default write button with avatar + actions
  const navRight = document.getElementById("v2NavRight");
  if (navRight) {
    const ini2 = (me.name || me.username).split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
    const avEl = me.avatar
      ? `<img src="${escapeHTML(me.avatar)}" alt="" loading="lazy">`
      : ini2;

    navRight.innerHTML = `
      <a href="write.html" class="v2-btn v2-btn--dark" style="font-size:13px;padding:7px 15px;">
        <svg viewBox="0 0 16 16" fill="none" width="13" height="13" aria-hidden="true"><path d="M11.5 2 14 4.5l-8.5 8.5L3 14l.5-2.5L11.5 2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        Write
      </a>
      <div class="v2-nav-av" id="v2AvatarBtn" tabindex="0" role="button" aria-haspopup="true" aria-label="Account menu">
        ${avEl}
      </div>
      <div class="v2-dropdown" id="v2AvatarDropdown" role="menu">
        <a class="v2-dd-item" href="profile.html">Profile</a>
        <a class="v2-dd-item" href="user.html?id=${escapeHTML(me.username)}">My journal</a>
        <a class="v2-dd-item" href="admin.html" id="v2AdminLink" style="display:none">Admin</a>
        <button class="v2-dd-item danger" id="v2LogoutBtn">Sign out</button>
      </div>`;

    // Avatar dropdown toggle
    const avatarBtn = document.getElementById("v2AvatarBtn");
    const dropdown  = document.getElementById("v2AvatarDropdown");

    if (avatarBtn && dropdown) {
      avatarBtn.addEventListener("click", e => {
        e.stopPropagation();
        dropdown.classList.toggle("open");
      });
      document.addEventListener("click", () => dropdown.classList.remove("open"));

      // Sign out wired to initShell's logout
      const logoutBtn = document.getElementById("v2LogoutBtn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", () => {
          if (typeof Progress.logout === "function") Progress.logout();
          else { localStorage.clear(); location.href = "index.html"; }
        });
      }

      // Admin link
      if (me.adminRole && ["owner","moderator"].includes(me.adminRole)) {
        const adminLink = document.getElementById("v2AdminLink");
        if (adminLink) adminLink.style.display = "";
      }
    }

    // Mobile profile link
    const mobProfile = document.getElementById("v2MobProfile");
    if (mobProfile) mobProfile.href = `user.html?id=${escapeHTML(me.username)}`;
  }
}

/* ── New posts polling ────────────────────────────────────── */
let v2LastCount = 0;
let v2NewAvail  = 0;
const v2NewBtn  = document.getElementById("v2NewBtn");
const v2NewTxt  = document.getElementById("v2NewBtnText");

if (v2NewBtn) {
  v2NewBtn.addEventListener("click", () => {
    v2NewBtn.classList.remove("show");
    v2RenderFeed();
    window.scrollTo({ top: 0, behavior: "smooth" });
    v2NewAvail = 0;
  });
}

async function v2CheckNew() {
  await Progress.loadFromApi().catch(() => {});
  const n = Progress.getPosts().length;
  if (!v2LastCount) { v2LastCount = n; return; }
  const diff = n - v2LastCount;
  if (diff > 0) {
    v2NewAvail += diff;
    v2LastCount = n;
    if (v2NewBtn && v2NewTxt) {
      v2NewTxt.textContent = v2NewAvail === 1 ? "1 new post" : `${v2NewAvail} new posts`;
      v2NewBtn.classList.add("show");
    }
  }
}

/* ── Event banner ─────────────────────────────────────────── */
let _efcTimer2 = null;
async function v2RenderEvent() {
  const banner = document.getElementById("v2EventBanner");
  if (!banner) return;
  try {
    const ev = await apiFetch("/api/events/current");
    if (!ev || !ev.id) return;
    const gradient = ev.gradient || "linear-gradient(-45deg,#ff6b9d,#ffd93d,#ff6b35,#c471ed)";
    banner.innerHTML = `
      <div class="event-feed-card" onclick="location.href='event.html'" role="link" tabindex="0" style="cursor:pointer;background:${gradient};background-size:300% 300%;">
        <div class="efc-inner">
          <div class="efc-row1">
            <div class="efc-live"><span class="efc-live-dot"></span>Live</div>
            <span class="efc-emoji">${ev.emoji || "🎮"}</span>
            <div class="efc-title">${escapeHTML(ev.title)}</div>
          </div>
          <div class="efc-row2">
            <div class="efc-countdown" id="v2EfcCountdown"></div>
            <a class="efc-cta" href="event.html?play=1" onclick="event.stopPropagation()">▶ Play</a>
          </div>
        </div>
      </div>`;
    const endDate = new Date(ev.endDate);
    clearInterval(_efcTimer2);
    function tick2() {
      const el = document.getElementById("v2EfcCountdown");
      if (!el) { clearInterval(_efcTimer2); return; }
      const diff = endDate - Date.now();
      if (diff <= 0) { el.innerHTML = `<span style="font-size:11px;color:rgba(255,255,255,.7)">Event ended</span>`; clearInterval(_efcTimer2); return; }
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      const u = (n,l) => `<div class="efc-unit"><span class="efc-unit-num">${String(n).padStart(2,"0")}</span><span class="efc-unit-label">${l}</span></div>`;
      const sep = `<span class="efc-sep">:</span>`;
      el.innerHTML = u(d,"days")+sep+u(h,"hrs")+sep+u(m,"min")+sep+u(s,"sec");
    }
    tick2();
    _efcTimer2 = setInterval(tick2, 1000);
  } catch {}
}

/* ── Daily prompt ─────────────────────────────────────────── */
async function v2RenderPrompt() {
  const wrap = document.getElementById("v2PromptBanner");
  if (!wrap) return;
  try {
    const data = await apiFetch("/api/daily-prompt");
    if (!data?.prompt) return;
    const expiresAt = data.expiresAt ? new Date(data.expiresAt) : null;
    if (expiresAt && expiresAt < Date.now()) return;
    wrap.innerHTML = `
      <div style="background:var(--v2-paper);border:1px solid var(--v2-border);border-left:3px solid var(--v2-accent);border-radius:var(--r-md);padding:13px 16px;">
        <span style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--v2-accent);font-family:var(--v2-font-m);display:block;margin-bottom:5px;">✏️ Today's prompt</span>
        <p style="margin:0;font-size:14.5px;color:var(--v2-ink);line-height:1.5;">${escapeHTML(data.prompt)}</p>
      </div>`;
  } catch {}
}

/* ── Search ───────────────────────────────────────────────── */
(function() {
  const input = document.getElementById("v2SearchInput");
  if (!input) return;
  let v2SearchActive = false;
  let v2SearchQuery  = "";

  input.addEventListener("input", () => {
    v2SearchQuery = input.value.trim().toLowerCase();
    v2SearchActive = v2SearchQuery.length > 0;
    v2RenderFeed();
  });

  input.addEventListener("keydown", e => {
    if (e.key === "Escape") { input.value = ""; input.blur(); v2SearchQuery = ""; v2SearchActive = false; v2RenderFeed(); }
  });

  /* Patch v2RenderFeed to honour search */
  const _origFilter = window._v2SearchFilter = (posts) => {
    if (!v2SearchActive) return posts;
    return posts.filter(p =>
      (p.title || "").toLowerCase().includes(v2SearchQuery) ||
      (p.excerpt || "").toLowerCase().includes(v2SearchQuery) ||
      (p.author || "").toLowerCase().includes(v2SearchQuery) ||
      (p.category || "").toLowerCase().includes(v2SearchQuery)
    );
  };

  /* Override getPosts for feed rendering when search is active */
  const _origGetPosts = Progress.getPosts.bind(Progress);
  const _v2GetPostsSearchWrapped = () => _v2SearchFilter ? _v2SearchFilter(_origGetPosts()) : _origGetPosts();

  /* Monkey-patch v2RenderFeed to use search filter */
  const _realRenderFeed = v2RenderFeed;
  v2RenderFeed = function() {
    if (!v2SearchActive) { _realRenderFeed(); return; }
    let posts = Progress.getPosts();
    posts = _v2SearchFilter(posts);
    const feed = document.getElementById("v2Feed");
    if (!posts.length) {
      feed.innerHTML = `<div class="v2-empty"><h3>No results for "${escapeHTML(v2SearchQuery)}"</h3><p>Try a different keyword.</p></div>`;
      return;
    }
    const readSet = v2GetRead();
    const [first, ...rest] = posts;
    feed.innerHTML = `${v2CardHTML(first, true, readSet)}${rest.length ? `<div class="v2-grid">${rest.map(p=>v2CardHTML(p,false,readSet)).join("")}</div>` : ""}`;
    feed.querySelectorAll(".v2-card").forEach(card => {
      card.addEventListener("click", e => {
        if (e.target.closest("a")) return;
        const href = card.dataset.href;
        if (href) { v2MarkRead(card.dataset.id); card.classList.add("v2-read"); location.href = href; }
      });
    });
  };
})();

/* ── Bootstrap ────────────────────────────────────────────── */
async function v2Start() {
  // Kick off initShell in background for auth/socket — nav hidden via CSS
  const ready = initShell("feed");

  // Init tabs
  v2InitTabs();

  // Initial render from cached data
  v2RenderFeed();

  // When posts arrive (cached), re-render
  window.addEventListener("progress:posts-loaded", () => {
    v2RenderFeed();
    v2LastCount = Progress.getPosts().length;
    document.getElementById("v2Loading")?.remove();
  }, { once: true });

  // Banners (don't await)
  v2RenderEvent();
  v2RenderPrompt();

  // Wait for full auth resolution
  ready.then(() => {
    document.getElementById("v2Loading")?.remove();
    v2RenderFeed();
    v2RenderTrending();
    v2RenderUserCard();
    if (typeof _v2BetaBadge === "function") _v2BetaBadge(Progress.getCurrentUser());
    v2LastCount = Progress.getPosts().length;
    // Poll for new posts every 45s
    setInterval(v2CheckNew, 45_000);
  }).catch(() => {
    document.getElementById("v2Loading")?.remove();
    v2RenderFeed();
    v2RenderTrending();
  });

  // Pull to refresh
  if (typeof initPullToRefresh === "function") {
    initPullToRefresh(async () => {
      await Progress.loadFromApi().catch(() => {});
      v2RenderFeed();
      v2RenderTrending();
      v2LastCount = Progress.getPosts().length;
      v2NewAvail = 0;
      document.getElementById("v2NewBtn")?.classList.remove("show");
    });
  }
}

v2Start();
</script>
