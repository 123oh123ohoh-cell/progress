<link rel="stylesheet" href="v2-compat.css">
<link rel="stylesheet" href="style.css">
<style>
#nav-root { display:none !important; }
body { background: var(--v2-bg); }

/* Write page layout */
.v2-write-layout {
  max-width: 720px; margin: 0 auto; padding: 40px 24px 100px;
}

@media (max-width: 740px) { .v2-write-layout { padding: 24px 0 88px; } }

/* Editor container overrides — the actual editor is injected by app.js */
#editorWrap { background: transparent; }

/* Override v1 editor styles to match v2 */
.editor-wrap .editor-header {
  border-bottom: 1px solid var(--v2-border) !important;
  padding-bottom: 20px !important;
  margin-bottom: 0 !important;
}
.editor-wrap .editor-title-input {
  font-family: var(--v2-font-d) !important;
  font-style: italic !important;
  font-size: clamp(26px,4vw,38px) !important;
  color: var(--v2-ink) !important;
  border: none !important;
  background: transparent !important;
  width: 100% !important;
  outline: none !important;
  line-height: 1.2 !important;
  padding: 0 !important;
}
.editor-wrap .editor-title-input::placeholder { color: var(--v2-muted) !important; }

.editor-wrap .toolbar {
  background: var(--v2-paper) !important;
  border: 1px solid var(--v2-border) !important;
  border-radius: var(--r-md) !important;
  box-shadow: var(--sh-xs) !important;
}
.editor-wrap .toolbar button,
.editor-wrap .tb-btn {
  border-radius: var(--r-sm) !important;
  color: var(--v2-muted) !important;
}
.editor-wrap .toolbar button:hover,
.editor-wrap .tb-btn:hover { background: var(--v2-paper-2) !important; color: var(--v2-ink) !important; }
.editor-wrap .toolbar button.active,
.editor-wrap .tb-btn.active { background: var(--v2-accent-dim) !important; color: var(--v2-accent) !important; }
.editor-wrap .tb-sep { background: var(--v2-border) !important; }

.editor-wrap .editor-area, .editor-wrap .ProseMirror,
.editor-wrap .editor-canvas, .editor-wrap [contenteditable] {
  font-size: 17px !important;
  line-height: 1.78 !important;
  color: var(--v2-ink) !important;
  background: transparent !important;
}
.editor-wrap .editor-canvas:empty::before { color: var(--v2-muted) !important; opacity: .6; }
.editor-wrap .editor-canvas h2 { font-family: var(--v2-font-d) !important; color: var(--v2-ink) !important; }
.editor-wrap .editor-canvas blockquote { border-left-color: var(--v2-ink) !important; color: var(--v2-mocha-dark) !important; }
.editor-wrap .editor-canvas img { border-color: var(--v2-border) !important; border-radius: var(--r-md) !important; }

/* Cover image drop zone — v1 class name */
.editor-wrap .editor-cover-drop, .editor-wrap .cover-upload-area {
  border: 2px dashed var(--v2-border) !important;
  border-radius: var(--r-lg) !important;
  background: var(--v2-paper-2) !important;
  color: var(--v2-muted) !important;
}
.editor-wrap .editor-cover-drop:hover,
.editor-wrap .cover-upload-area:hover { border-color: var(--v2-border-2) !important; background: var(--v2-paper) !important; }

.editor-wrap .editor-meta-row,
.editor-wrap .editor-meta { border-top: 1px solid var(--v2-border) !important; padding-top: 16px !important; }

/* Editor actions — lift above v2 mobile bottom nav */
.editor-wrap .editor-actions { bottom: 84px !important; right: 20px !important; }

.editor-wrap .editor-submit, .editor-wrap .btn.primary {
  background: var(--v2-ink) !important;
  color: var(--v2-bg) !important;
  border-radius: 22px !important;
  border: none !important;
  font-size: 14px !important;
  font-weight: 600 !important;
  padding: 10px 24px !important;
  cursor: pointer !important;
}
.editor-wrap .editor-submit:hover, .editor-wrap .btn.primary:hover { opacity: .9 !important; }

.editor-wrap .btn.secondary {
  background: var(--v2-paper) !important;
  color: var(--v2-ink) !important;
  border: 1.5px solid var(--v2-border) !important;
  border-radius: 22px !important;
  font-size: 14px !important;
  font-weight: 600 !important;
}
.editor-wrap .btn.secondary:hover { border-color: var(--v2-border-2) !important; }

/* Category selector */
.editor-wrap .category-select, .editor-wrap select {
  border: 1.5px solid var(--v2-border) !important;
  border-radius: var(--r-md) !important;
  background: var(--v2-paper) !important;
  color: var(--v2-ink) !important;
  font-family: var(--v2-font-b) !important;
  font-size: 13.5px !important;
  padding: 8px 12px !important;
}

/* Daily limit banner */
.daily-limit-banner {
  background: var(--v2-paper) !important;
  border: 1px solid var(--v2-border) !important;
  border-left: 3px solid var(--v2-mocha) !important;
  border-radius: var(--r-md) !important;
  padding: 14px 16px !important;
}

/* Feed-empty (not logged in) */
.editor-wrap .feed-empty {
  text-align: center;
  padding: 80px 0;
  color: var(--v2-muted);
}
.editor-wrap .feed-empty h3 {
  font-family: var(--v2-font-d); font-style: italic;
  font-size: 26px; color: var(--v2-ink); margin-bottom: 8px;
}

/* URL overlay */
.editor-url-overlay {
  background: var(--v2-paper) !important;
  border: 1px solid var(--v2-border) !important;
  border-radius: var(--r-lg) !important;
  box-shadow: var(--sh-lg) !important;
}
.editor-url-overlay input {
  border: 1.5px solid var(--v2-border) !important;
  border-radius: var(--r-md) !important;
  background: var(--v2-paper-2) !important;
  color: var(--v2-ink) !important;
  font-family: var(--v2-font-b) !important;
}
.editor-url-overlay input:focus { border-color: var(--v2-accent) !important; }
.editor-url-overlay-confirm {
  background: var(--v2-ink) !important; color: var(--v2-bg) !important;
  border: none !important; border-radius: var(--r-md) !important;
}
.editor-url-overlay-cancel {
  background: transparent !important; color: var(--v2-muted) !important;
  border: 1.5px solid var(--v2-border) !important; border-radius: var(--r-md) !important;
}
</style>
</head>
<body class="v2 mobile page-write">

<div id="nav-root" aria-hidden="true"></div>

</nav>

</div>

<!-- Mobile bottom nav -->
<nav class="v2-mob-nav" aria-label="Mobile navigation">

<script src="../data.js"></script>
<script src="../app.js"></script>
<script src="v2-nav.js"></script>
<script>
  /* URL overlay wiring */
  let _urlResolve = null;
  const urlOverlay = document.getElementById("urlOverlay");
  const urlOverlayInput = document.getElementById("urlOverlayInput");
  const urlOverlayLabel = document.getElementById("urlOverlayLabel");

  function askForUrl(label, placeholder) {
    return new Promise(resolve => {
      _urlResolve = resolve;
      urlOverlayLabel.textContent = label;
      urlOverlayInput.placeholder = placeholder || "https://…";
      urlOverlayInput.value = "";
      urlOverlay.classList.add("open");
      setTimeout(() => urlOverlayInput.focus(), 60);
    });
  }
  function closeUrlOverlay(value) {
    urlOverlay.classList.remove("open");
    urlOverlayInput.blur();
    if (_urlResolve) { _urlResolve(value || null); _urlResolve = null; }
  }
  document.getElementById("urlOverlayConfirm").addEventListener("click", () => closeUrlOverlay(urlOverlayInput.value.trim()));
  document.getElementById("urlOverlayCancel").addEventListener("click", () => closeUrlOverlay(null));
  urlOverlayInput.addEventListener("keydown", e => {
    if (e.key === "Enter") closeUrlOverlay(urlOverlayInput.value.trim());
    if (e.key === "Escape") closeUrlOverlay(null);
  });

  async function start() {
    const ready = initShell("write");
    v2BootNav(ready);

    const wrap = document.getElementById("editorWrap");
    wrap.innerHTML = `<p style="color:var(--v2-muted);padding:40px 16px;font-size:14px;">Loading…</p>`;

    await ready.catch(() => {});

    Progress.loadFromApi().catch(() => {});
    const user = Progress.getCurrentUser();
    let coverData = null;
    let pendingImageUploads = 0;
    let selectedCategory = "";
    const isMobile = document.body.classList.contains("mobile");

    if (!user) {
      wrap.innerHTML = `
        <div class="feed-empty" style="padding-top:80px;">
          <h3>Log in to write an entry</h3>
          <p>Use the account menu in the top right to log in or create an account.</p>
        </div>`;
      return;
    }

    // ── Daily post limit check ──────────────────────────────────────────────
    let _dailyResetAt = null;
    let _countdownTimer = null;

    function formatCountdown(ms) {
      if (ms <= 0) return "now";
      const totalSec = Math.ceil(ms / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      if (h > 0) return `${h}h ${m}m`;
      if (m > 0) return `${m}m ${s}s`;
      return `${s}s`;
    }

    function showDailyLimitBanner(resetAt) {
      _dailyResetAt = resetAt;
      let banner = document.getElementById("dailyLimitBanner");
      if (!banner) {
        banner = document.createElement("div");
        banner.id = "dailyLimitBanner";
        banner.className = "daily-limit-banner";
        banner.innerHTML = `<span style="font-size:20px;">📅</span><span id="dailyLimitText"></span>`;
        wrap.prepend(banner);
      }
      function tick() {
        const remaining = _dailyResetAt - Date.now();
        const el = document.getElementById("dailyLimitText");
        if (el) {
          if (remaining <= 0) {
            el.textContent = "You can post again now — refresh the page!";
            clearInterval(_countdownTimer);
          } else {
            el.textContent = `You've already posted today. Next entry unlocks in ${formatCountdown(remaining)}.`;
          }
        }
      }
      clearInterval(_countdownTimer);
      tick();
      _countdownTimer = setInterval(tick, 1000);
      const pb = document.getElementById("publishBtn");
      if (pb) { pb.disabled = true; pb.title = "One entry per day"; }
    }

    apiFetch("/api/posts/can-post").then(r => {
      if (r && !r.canPost) showDailyLimitBanner(r.resetAt);
    }).catch(() => {});

    // ── Render editor HTML ──────────────────────────────────────────────────
    wrap.innerHTML = `
      ${isMobile ? `
      <div class="editor-mobile-bar">
        <span class="editor-mobile-label">New entry</span>
        <button class="editor-mobile-cancel" id="cancelBtn">Discard</button>
        <button class="editor-mobile-publish" id="publishBtn">Publish</button>
      </div>` : ""}

      <div class="editor-cover-drop" id="coverDrop">
        <div class="cover-hint">${isMobile ? "Tap to add a cover photo" : "Click to add a cover image (optional)"}</div>
      </div>

      <input class="editor-title-input" id="titleInput" placeholder="Give this entry a title"
        ${isMobile ? 'inputmode="text" autocapitalize="sentences"' : ""}>

      <div class="editor-category-row" id="categoryRow">
        <span class="editor-category-label">Category</span>
        <button type="button" class="editor-cat-btn active" data-cat="">None</button>
        <button type="button" class="editor-cat-btn" data-cat="development">Development</button>
        <button type="button" class="editor-cat-btn" data-cat="creative">Creative</button>
        <button type="button" class="editor-cat-btn" data-cat="random">Random</button>
      </div>

      <div class="toolbar" id="toolbar">
        <button class="tb-btn" data-cmd="bold" title="Bold"><strong>B</strong></button>
        <button class="tb-btn" data-cmd="italic" title="Italic"><em>I</em></button>
        <button class="tb-btn" data-cmd="underline" title="Underline"><u>U</u></button>
        <div class="tb-sep"></div>
        <button class="tb-btn" data-cmd="formatBlock" data-value="H2" title="Heading">H2</button>
        <button class="tb-btn" data-cmd="formatBlock" data-value="BLOCKQUOTE" title="Quote">&ldquo;</button>
        <button class="tb-btn" data-cmd="formatBlock" data-value="P" title="Paragraph">&para;</button>
        <div class="tb-sep"></div>
        <button class="tb-btn" data-cmd="insertUnorderedList" title="Bulleted list">&bull;&equiv;</button>
        <button class="tb-btn" id="insertLinkBtn" title="Link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1.5-1.5"/></svg>
        </button>
        <button class="tb-btn" id="insertImageBtn" title="Insert image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5-9 9"/></svg>
        </button>
        <button class="tb-btn" id="insertSpotifyBtn" title="Spotify">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </button>
        <button class="tb-btn" id="insertYoutubeBtn" title="YouTube">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="M10.5 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="tb-btn" id="insertVideoBtn" title="Upload video">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 10l4.553-2.276A1 1 0 0 1 21 8.618v6.764a1 1 0 0 1-1.447.894L15 14"/><rect x="2" y="6" width="13" height="12" rx="2"/></svg>
        </button>
      </div>

      <div class="editor-canvas" id="canvas" contenteditable="true"
           data-placeholder="Start writing…"
           ${isMobile ? 'inputmode="text"' : ""}></div>

      ${!isMobile ? `
      <div class="editor-actions">
        <button class="btn" id="cancelBtn">Cancel</button>
        <button class="btn primary" id="publishBtn">Publish</button>
      </div>` : ""}
    `;

    if (isMobile && window.visualViewport) {
      const toolbar = document.getElementById("toolbar");
      const syncToolbar = () => {
        const vv = window.visualViewport;
        const kbHeight = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
        document.documentElement.style.setProperty("--kb-offset", kbHeight + "px");
      };
      window.visualViewport.addEventListener("resize", syncToolbar, { passive: true });
      window.visualViewport.addEventListener("scroll", syncToolbar, { passive: true });
      document.getElementById("canvas").addEventListener("blur", () => {
        document.documentElement.style.setProperty("--kb-offset", "0px");
      });
    }

    document.getElementById("categoryRow").querySelectorAll(".editor-cat-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".editor-cat-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedCategory = btn.dataset.cat || "";
      });
    });

    const coverDrop  = document.getElementById("coverDrop");
    const coverInput = document.getElementById("coverInput");
    coverDrop.addEventListener("click", () => coverInput.click());
    coverInput.addEventListener("change", () => {
      const file = coverInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        const localPreview = reader.result;
        coverDrop.innerHTML = `<img src="${localPreview}" alt=""><div style="font-size:12px;color:var(--v2-muted);margin-top:8px;">Uploading…</div>`;
        pendingImageUploads++;
        const uploaded = await apiFetch("/api/upload-image", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: localPreview })
        });
        pendingImageUploads--;
        if (uploaded && uploaded.url) {
          coverData = uploaded.url;
          coverDrop.innerHTML = `<img src="${uploaded.url}" alt="">`;
        } else {
          showToast("Could not upload cover image. Try again.");
          coverData = null;
          coverDrop.innerHTML = `<div class="cover-hint">${isMobile ? "Tap to add a cover photo" : "Click to add a cover image (optional)"}</div>`;
        }
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("toolbar").addEventListener("click", e => {
      const btn = e.target.closest(".tb-btn[data-cmd]");
      if (!btn) return;
      document.getElementById("canvas").focus();
      const cmd = btn.dataset.cmd;
      if (cmd === "formatBlock") {
        document.execCommand(cmd, false, btn.dataset.value);
      } else {
        document.execCommand(cmd, false, null);
      }
      updateToolbarState();
    });

    document.getElementById("insertLinkBtn").addEventListener("click", async () => {
      const sel = window.getSelection();
      const savedRange = sel && sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
      const url = isMobile
        ? await askForUrl("Link URL", "https://example.com")
        : prompt("Link URL:");
      if (!url) return;
      document.getElementById("canvas").focus();
      if (savedRange) { const s = window.getSelection(); s.removeAllRanges(); s.addRange(savedRange); }
      document.execCommand("createLink", false, url);
    });

    const imageInput = document.getElementById("imageInput");
    document.getElementById("insertImageBtn").addEventListener("click", () => imageInput.click());
    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        document.getElementById("canvas").focus();
        const pid = "img-upload-" + Date.now() + Math.random().toString(36).slice(2, 7);
        document.execCommand("insertHTML", false, `<img id="${pid}" src="${reader.result}" style="opacity:.5;">`);
        pendingImageUploads++;
        const uploaded = await apiFetch("/api/upload-image", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: reader.result })
        });
        pendingImageUploads--;
        const placeholder = document.getElementById(pid);
        if (uploaded && uploaded.url && placeholder) {
          placeholder.src = uploaded.url;
          placeholder.style.opacity = "";
          placeholder.removeAttribute("id");
        } else if (placeholder) {
          showToast("Could not upload that image. Try again.");
          placeholder.remove();
        }
      };
      reader.readAsDataURL(file);
      imageInput.value = "";
    });

    const videoInput = document.getElementById("videoInput");
    document.getElementById("insertVideoBtn").addEventListener("click", () => videoInput.click());
    videoInput.addEventListener("change", async () => {
      const file = videoInput.files[0];
      if (!file) return;
      videoInput.value = "";
      if (file.size > 50 * 1024 * 1024) { showToast("Video over 50 MB — compress it or use YouTube."); return; }
      document.getElementById("canvas").focus();
      const pid = "vid-" + Date.now();
      document.execCommand("insertHTML", false,
        '<div id="' + pid + '" class="post-video-uploading" contenteditable="false"><span class="post-video-spinner"></span><span>Uploading video…</span></div><p><br></p>'
      );
      pendingImageUploads++;
      let videoUrl = null;
      try {
        const urlData = await apiFetch("/api/storage-upload-url", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ filename: file.name, mimeType: file.type })
        });
        if (urlData && urlData.uploadUrl) {
          const up = await fetch(urlData.uploadUrl, { method: "PUT", headers: { "Content-Type": file.type }, body: file });
          if (up.ok) videoUrl = urlData.publicUrl;
        }
      } catch {}
      pendingImageUploads--;
      const ph = document.getElementById(pid);
      if (videoUrl && ph) {
        const fig = document.createElement("figure");
        fig.className = "post-video-wrap";
        fig.contentEditable = "false";
        fig.innerHTML = '<video class="post-video" controls preload="metadata" src="' + videoUrl + '"></video>';
        ph.replaceWith(fig);
      } else {
        if (ph) ph.remove();
        showToast("Could not upload that video. Try again.");
      }
    });

    document.getElementById("insertSpotifyBtn").addEventListener("click", async () => {
      const url = isMobile
        ? await askForUrl("Spotify link", "https://open.spotify.com/track/…")
        : prompt("Paste a Spotify track, album, playlist, or artist link:");
      if (!url) return;
      const embed = renderSpotifyEmbed({ spotify: url.trim() });
      if (!embed) { showToast("That doesn't look like a Spotify link."); return; }
      document.getElementById("canvas").focus();
      document.execCommand("insertHTML", false, `<div class="spotify-post-embed" contenteditable="false">${embed}</div><p><br></p>`);
    });

    document.getElementById("insertYoutubeBtn").addEventListener("click", async () => {
      const url = isMobile
        ? await askForUrl("YouTube link", "https://youtube.com/watch?v=…")
        : prompt("Paste a YouTube video link:");
      if (!url) return;
      const embed = renderYouTubeEmbed(url);
      if (!embed) { showToast("That doesn't look like a YouTube link."); return; }
      document.getElementById("canvas").focus();
      document.execCommand("insertHTML", false, embed + "<p><br></p>");
    });

    function updateToolbarState() {
      ["bold","italic","underline"].forEach(cmd => {
        const btn = document.querySelector(`.tb-btn[data-cmd="${cmd}"]`);
        if (btn) btn.classList.toggle("active", document.queryCommandState(cmd));
      });
    }
    document.getElementById("canvas").addEventListener("keyup",    updateToolbarState);
    document.getElementById("canvas").addEventListener("mouseup",  updateToolbarState);
    document.getElementById("canvas").addEventListener("touchend", updateToolbarState);

    document.getElementById("cancelBtn").addEventListener("click", () => {
      const hasContent = document.getElementById("canvas").innerText.trim() ||
                         document.getElementById("titleInput").value.trim();
      if (!hasContent || confirm("Discard this entry?")) location.href = "index.html";
    });

    async function doPublish() {
      if (pendingImageUploads > 0) { showToast("Still uploading — one sec, then try again."); return; }
      const title   = document.getElementById("titleInput").value.trim();
      const content = document.getElementById("canvas").innerHTML.trim();
      if (!title)   { showToast("Give your entry a title first."); return; }
      if (!content) { showToast("Write something before publishing."); return; }

      const publishBtn = document.getElementById("publishBtn");
      publishBtn.disabled = true;
      publishBtn.textContent = "Publishing…";

      const plain   = document.getElementById("canvas").innerText.trim();
      const excerpt = plain.slice(0, 140) + (plain.length > 140 ? "…" : "");

      let post = null;
      try {
        const token = getAuthToken();
        const res = await fetch(API_BASE + "/api/posts", {
          method: "POST",
          headers: { "Content-Type": "application/json", ...(token ? { Authorization: `Bearer ${token}` } : {}) },
          body: JSON.stringify({ title, content, cover: coverData, excerpt, category: selectedCategory || null })
        });
        if (res.status === 429) {
          const err = await res.json().catch(() => ({}));
          publishBtn.disabled = false;
          publishBtn.textContent = "Publish";
          showDailyLimitBanner(err.resetAt || (Date.now() + 86400000));
          return;
        }
        if (res.ok) {
          post = await res.json();
          await Progress.loadFromApi().catch(() => {});
        }
      } catch {}

      publishBtn.disabled = false;
      publishBtn.textContent = "Publish";
      if (!post) { showToast("Could not publish. Try again."); return; }
      showToast("Published.");
      setTimeout(() => location.href = "post.html?id=" + post.id, 500);
    }

    document.getElementById("publishBtn").addEventListener("click", doPublish);

    if (!isMobile) {
      setTimeout(() => document.getElementById("canvas").focus(), 80);
    }
  }
  start();
</script>
</body>
</html>
