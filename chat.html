<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>(function(){try{var t=localStorage.getItem("progressTheme");var dark=(t==="dark")||(t!=="light"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(dark)document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
</head>
<body>

<div id="nav-root"></div>
<div id="modal-root"></div>

<div id="chatSidebarOverlay" class="chat-sidebar-overlay"></div>

<!-- Left-edge drawer pull tab — tap or swipe to open the room list -->
<div class="chat-drawer-tab" id="chatDrawerTab" role="button" aria-label="Open conversations" tabindex="0">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="9 18 15 12 9 6"/>
  </svg>
</div>

<main class="chat-page-main">
  <div class="chat-wrap" id="chatWrap">
    <!-- filled by JS -->
  </div>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
  const GLOBAL_ROOM = "global";
  const HISTORY_LIMIT = 50;

  let socket = null;
  let reconnectDelay = 1000;
  let reconnectTimer = null;
  let manuallyClosed = false;
  let typingHintTimer = null;
  let lastTypingSent = 0;
  let seenMessageIds = new Set();
  let lastRenderedDateKey = null;

  // Grouping: track last appended message to collapse consecutive same-author messages
  let lastGroupAuthor = null;
  let lastGroupTime   = null;

  // Online presence: username → "online" | "idle" | "offline"
  const onlineStatuses = new Map();

  // Reply context
  let replyContext = null;

  // Scroll-to-bottom unread counter
  let scrollUnreadCount = 0;

  // Song pending to send
  let songPending = null;
  let songSearchTimer = null;
  let previewAudio = null;

  let currentUser = null;
  let currentRoom = GLOBAL_ROOM;
  let currentPeer = null; // username, or null for the global room

  function dmRoomId(a, b) {
    return "dm:" + [a, b].sort().join(":");
  }

  function wsUrl(room) {
    return `${WS_BASE}/ws/chat?room=${encodeURIComponent(room)}&token=${encodeURIComponent(getAuthToken())}`;
  }

  function setStatus(text, cls) {
    const el = document.getElementById("chatStatus");
    if (!el) return;
    el.textContent = text;
    el.className = "chat-status" + (cls ? ` ${cls}` : "");
  }

  function updateScrollBtn() {
    const log = document.getElementById("chatLog");
    const btn = document.getElementById("chatScrollBtn");
    const countEl = document.getElementById("chatScrollCount");
    if (!log || !btn) return;
    const distFromBottom = log.scrollHeight - log.scrollTop - log.clientHeight;
    const show = distFromBottom > 160;
    btn.classList.toggle("visible", show);
    if (!show) { scrollUnreadCount = 0; }
    if (countEl) {
      countEl.textContent = scrollUnreadCount > 0 ? scrollUnreadCount : "";
      countEl.classList.toggle("has-count", scrollUnreadCount > 0);
    }
  }

  function scrollToBottom(force, smooth) {
    const log = document.getElementById("chatLog");
    if (!log) return;
    const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 120;
    if (force || nearBottom) {
      if (smooth) {
        log.scrollTo({ top: log.scrollHeight, behavior: "smooth" });
      } else {
        log.scrollTop = log.scrollHeight;
      }
      scrollUnreadCount = 0;
      updateScrollBtn();
    }
  }

  function messageRow(msg, grouped) {
    const author = Progress.getUser(msg.author);
    const mine = currentUser && msg.author === currentUser.username;
    const imageHTML = msg.image ? `<div class="chat-image"><img src="${msg.image}" alt="Shared image" loading="lazy"></div>` : "";
    const replyHTML = msg.replyTo ? `
      <div class="chat-reply-quote" data-target-id="${escapeHTML(msg.replyTo.id)}">
        <span class="chat-reply-quote-author">@${escapeHTML(msg.replyTo.author)}</span>
        <span class="chat-reply-quote-body">${escapeHTML((msg.replyTo.body || "📷 Image").slice(0, 120))}</span>
      </div>` : "";
    // Song card
    let songCardHTML = "";
    if (msg.type === "song" && msg.songData) {
      const s = msg.songData;
      const artEl = s.albumArt
        ? `<img class="chat-song-art" src="${escapeHTML(s.albumArt)}" alt="">`
        : `<div class="chat-song-art-fallback">♪</div>`;
      // Wrap the whole card in a Spotify link; add play button only if preview exists
      const spotifyHref = escapeHTML(s.spotifyUrl || "#");
      const playBtn = s.previewUrl
        ? `<button type="button" class="chat-song-preview-btn" data-preview="${escapeHTML(s.previewUrl)}" aria-label="Preview 30s">
             <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
           </button>`
        : "";
      songCardHTML = `<a class="chat-song-card" href="${spotifyHref}" target="_blank" rel="noopener" aria-label="Open on Spotify">
        ${artEl}
        <div class="chat-song-info">
          <span class="chat-song-name">${escapeHTML(s.name)}</span>
          <span class="chat-song-artist">${escapeHTML(s.artists)}</span>
          <div class="chat-song-spotify-badge">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="#1DB954"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
            Open on Spotify
          </div>
        </div>
        ${playBtn}
      </a>`;
    }

    // Game card
    let gameCardHTML = "";
    if (msg.type === "game" && msg.gameData) {
      const g = msg.gameData;
      let gameInner = "";
      if (g.gameType === "wyr") {
        gameInner = `<div class="chat-game-options">
          <button type="button" class="chat-game-option" data-game-id="${escapeHTML(msg.id)}" data-choice="a">${escapeHTML(g.optionA)}</button>
          <button type="button" class="chat-game-option" data-game-id="${escapeHTML(msg.id)}" data-choice="b">${escapeHTML(g.optionB)}</button>
        </div>`;
      } else if (g.gameType === "word") {
        gameInner = `<div class="chat-game-options"><button type="button" class="chat-game-option" data-game-id="${escapeHTML(msg.id)}" data-choice="reply">Reply with a word →</button></div>`;
      } else if (g.gameType === "emoji") {
        gameInner = `<div class="chat-game-options"><button type="button" class="chat-game-option" data-game-id="${escapeHTML(msg.id)}" data-choice="emoji">Add an emoji →</button></div>`;
      }
      const icons = { wyr: "🤔", word: "💬", emoji: "✨" };
      const labels = { wyr: "Would You Rather", word: "Word Association", emoji: "Emoji Story" };
      gameCardHTML = `<div class="chat-game-card">
        <div class="chat-game-tag">${icons[g.gameType] || "🎮"} ${escapeHTML(labels[g.gameType] || "Game")}</div>
        <div class="chat-game-body">${escapeHTML(g.prompt)}</div>
        ${gameInner}
      </div>`;
    }

    const bodyHTML = songCardHTML || gameCardHTML ||
      ((msg.body || replyHTML) ? `<div class="chat-bubble">${replyHTML}${msg.body ? renderMentionsInHTML(renderEmoticonsText(msg.body, "inline-emoticon")) : ""}</div>` : "");
    return `
      <div class="chat-msg ${mine ? "mine" : ""} ${grouped ? "grouped" : ""}" data-id="${msg.id}">
        ${!mine ? `<a href="user.html?username=${encodeURIComponent(msg.author)}" class="chat-avatar">${avatarHTML(author, 30)}</a>` : ""}
        <div class="chat-bubble-col">
          <div class="chat-reply-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>
          </div>
          ${!mine && currentRoom === GLOBAL_ROOM && !grouped ? `<span class="chat-author">@${escapeHTML(msg.author)}</span>` : ""}
          ${imageHTML}
          ${bodyHTML}
          <div class="chat-meta-row">
            <span class="chat-time">${Progress.timeAgo(msg.time)}</span>
            ${mine && currentRoom.startsWith("dm:") ? '<span class="chat-seen-tick" id="seen-' + msg.id + '"></span>' : ""}
          </div>
        </div>
      </div>`;
  }

  function dateSeparatorLabel(isoTime) {
    const msgDate = new Date(isoTime);
    const today = new Date();
    if (msgDate.toDateString() === today.toDateString()) return "Today";
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    if (msgDate.toDateString() === yesterday.toDateString()) return "Yesterday";
    const sameYear = msgDate.getFullYear() === today.getFullYear();
    return msgDate.toLocaleDateString(undefined, sameYear ? { month: "long", day: "numeric" } : { month: "long", day: "numeric", year: "numeric" });
  }

  const linkPreviewCache = new Map();

  function extractFirstUrl(text) {
    const match = (text || "").match(/https?:\/\/[^\s<]+/i);
    return match ? match[0] : null;
  }

  async function attachLinkPreview(msg) {
    const url = extractFirstUrl(msg.body);
    if (!url) return;
    const bubbleCol = document.querySelector(`.chat-msg[data-id="${msg.id}"] .chat-bubble-col`);
    if (!bubbleCol) return;

    let preview;
    if (linkPreviewCache.has(url)) {
      preview = linkPreviewCache.get(url);
    } else {
      const result = await apiFetch(`/api/link-preview?url=${encodeURIComponent(url)}`);
      preview = (result && result.preview) || null;
      linkPreviewCache.set(url, preview);
    }
    if (!preview) return;

    const card = document.createElement("a");
    card.className = "chat-link-preview";
    card.href = preview.url;
    card.target = "_blank";
    card.rel = "noopener noreferrer";
    card.innerHTML = `
      ${preview.image ? `<img src="${preview.image}" alt="">` : ""}
      <div class="chat-link-preview-body">
        ${preview.siteName ? `<div class="chat-link-preview-site">${escapeHTML(preview.siteName)}</div>` : ""}
        ${preview.title ? `<div class="chat-link-preview-title">${escapeHTML(preview.title)}</div>` : ""}
        ${preview.description ? `<div class="chat-link-preview-desc">${escapeHTML(preview.description)}</div>` : ""}
      </div>
    `;
    const timeEl = bubbleCol.querySelector(".chat-time");
    if (timeEl) bubbleCol.insertBefore(card, timeEl);
    else bubbleCol.appendChild(card);
    scrollToBottom();
  }

  function appendMessage(msg, animate) {
    if (seenMessageIds.has(msg.id)) return;
    seenMessageIds.add(msg.id);
    const log = document.getElementById("chatLog");
    if (!log) return;
    const empty = log.querySelector(".chat-empty");
    if (empty) empty.remove();

    const dayKey = new Date(msg.time).toDateString();
    if (dayKey !== lastRenderedDateKey) {
      lastRenderedDateKey = dayKey;
      lastGroupAuthor = null; // reset grouping on date break
      lastGroupTime = null;
      log.insertAdjacentHTML("beforeend", `<div class="chat-date-separator"><span>${dateSeparatorLabel(msg.time)}</span></div>`);
    }

    // Determine grouping: same author, within 3 minutes, no date separator just inserted
    const msgTime = new Date(msg.time);
    const grouped = lastGroupAuthor === msg.author
      && lastGroupTime
      && (msgTime - lastGroupTime) < 180000;

    lastGroupAuthor = msg.author;
    lastGroupTime = msgTime;

    log.insertAdjacentHTML("beforeend", messageRow(msg, grouped));

    const msgEl = log.querySelector(`[data-id="${msg.id}"]`);
    if (msgEl) {
      if (animate) msgEl.classList.add("chat-msg-new");
      addSwipeToReply(msgEl, msg);
      // Clicking a reply quote scrolls to the original message
      msgEl.querySelectorAll(".chat-reply-quote").forEach(q => {
        q.addEventListener("click", () => scrollToMessage(q.dataset.targetId));
      });
    }

    // If user scrolled up and this is an incoming (animated) message, bump count
    if (animate) {
      const log2 = document.getElementById("chatLog");
      if (log2) {
        const distFromBottom = log2.scrollHeight - log2.scrollTop - log2.clientHeight;
        if (distFromBottom > 160) {
          scrollUnreadCount++;
          updateScrollBtn();
        }
      }
    }
    scrollToBottom(animate, animate); // live messages: force + smooth scroll; history: instant at load
    attachLinkPreview(msg);
  }

  function renderPresence(users) {
    const el = document.getElementById("chatPresence");
    if (!el) return;
    if (currentRoom !== GLOBAL_ROOM) { el.textContent = ""; return; }
    const unique = Array.from(new Set(users || []));
    if (!unique.length) { el.textContent = ""; return; }
    el.textContent = unique.length === 1 ? `@${unique[0]} is here` : `${unique.length} people here now`;
  }

  // ── Online presence ──────────────────────────────────────────────────────────

  function applyGlobalPresence(statuses) {
    onlineStatuses.clear();
    for (const [u, s] of Object.entries(statuses || {})) onlineStatuses.set(u, s);
    updatePresenceDots();
    updateChatHeader();
  }

  function updatePresenceDots() {
    document.querySelectorAll(".chat-room-item[data-peer]").forEach(item => {
      const peer = item.dataset.peer;
      if (!peer) return;
      const status = onlineStatuses.get(peer) || "offline";
      const wrap = item.querySelector(".chat-room-av-wrap");
      if (!wrap) return;
      let dot = wrap.querySelector(".chat-room-presence");
      if (status === "offline") { if (dot) dot.remove(); return; }
      if (!dot) {
        dot = document.createElement("div");
        wrap.appendChild(dot);
      }
      dot.className = `chat-room-presence${status === "idle" ? " idle" : ""}`;
    });
  }

  function updateChatHeader() {
    const peerEl     = document.getElementById("chatHeaderPeer");
    const titleEl    = document.getElementById("chatRoomTitle");
    const presenceEl = document.getElementById("chatPresence");
    if (!peerEl) return;

    if (currentPeer) {
      const peerUser = Progress.getUser(currentPeer);
      const status   = onlineStatuses.get(currentPeer) || "offline";
      const statusLabels = { online: "online", idle: "away", offline: "offline" };
      const profileUrl = `user.html?username=${encodeURIComponent(currentPeer)}`;

      // Rebuild the peer area as a single clickable link
      peerEl.innerHTML = `
        <a href="${profileUrl}" class="chat-header-peer-link" title="View @${escapeHTML(currentPeer)}'s profile">
          <div class="chat-header-peer-avatar">
            ${avatarHTML(peerUser, 34)}
            <div class="chat-header-presence-dot ${escapeHTML(status)}"></div>
          </div>
          <div class="chat-header-peer-info">
            <span class="chat-header-peer-name">@${escapeHTML(currentPeer)}</span>
            <span class="chat-header-peer-status ${escapeHTML(status)}">${escapeHTML(statusLabels[status] || "offline")}</span>
          </div>
        </a>`;

      peerEl.classList.add("visible");
      if (titleEl) titleEl.style.display = "none";
      if (presenceEl) presenceEl.style.display = "none";
    } else {
      peerEl.classList.remove("visible");
      peerEl.innerHTML = "";
      if (titleEl) titleEl.style.display = "";
      if (presenceEl) presenceEl.style.display = "";
    }
  }

  // ── Discord-style rail ───────────────────────────────────────────────────────

  async function loadRail() {
    const rooms = document.getElementById("chatRailRooms");
    if (!rooms) return;
    const conversations = await apiFetch("/api/chat/conversations") || [];
    const slots = [];

    // Global room
    const globalActive = currentRoom === GLOBAL_ROOM;
    slots.push(`
      <div class="chat-rail-slot${globalActive ? " active" : ""}" data-room="${GLOBAL_ROOM}" title="Global">
        <button type="button" class="chat-rail-btn" data-room="${GLOBAL_ROOM}">#</button>
      </div>`);

    if (conversations.length) {
      slots.push(`<div class="chat-rail-separator"></div>`);
      conversations.slice(0, 12).forEach(conv => {
        const dmRoom = conv.room;
        const peer = conv.with;
        const peerUser = Progress.getUser(peer);
        const active = currentRoom === dmRoom;
        const status = onlineStatuses.get(peer) || "offline";
        const dotHTML = status !== "offline"
          ? `<div class="chat-rail-dot${status === "idle" ? " idle" : ""}"></div>` : "";
        const unreadHTML = (!active && conv.unreadCount) ? `<div class="chat-rail-unread"></div>` : "";
        const avatarInner = peerUser && peerUser.avatar
          ? `<img src="${escapeHTML(peerUser.avatar)}" alt="${escapeHTML(peer)}">`
          : `<span>${escapeHTML(peer.slice(0, 2).toUpperCase())}</span>`;
        slots.push(`
          <div class="chat-rail-slot${active ? " active" : ""}" data-room="${escapeHTML(dmRoom)}" title="@${escapeHTML(peer)}">
            <button type="button" class="chat-rail-btn" data-room="${escapeHTML(dmRoom)}" data-peer="${escapeHTML(peer)}">
              ${avatarInner}${dotHTML}${unreadHTML}
            </button>
          </div>`);
      });
    }

    rooms.innerHTML = slots.join("");
    rooms.querySelectorAll(".chat-rail-slot").forEach(slot => {
      slot.addEventListener("click", () => {
        const room = slot.dataset.room;
        const btn = slot.querySelector(".chat-rail-btn");
        const peer = btn?.dataset.peer || null;
        const label = peer ? `@${peer}` : "Global";
        if (room !== currentRoom) switchRoom(room, label, peer);
        else document.querySelectorAll(".chat-rail-slot").forEach(s => s.classList.toggle("active", s.dataset.room === room));
      });
    });
  }

  function showTypingHint(username) {
    if (!username || username === currentUser.username) return;
    const el = document.getElementById("chatTyping");
    if (!el) return;
    el.innerHTML = `<span>@${escapeHTML(username)} is typing</span><span class="typing-dots"><span></span><span></span><span></span></span>`;
    clearTimeout(typingHintTimer);
    typingHintTimer = setTimeout(() => { el.innerHTML = ""; }, 2800);
  }

  function closeSocket() {
    manuallyClosed = true;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    if (socket) { try { socket.close(); } catch (e) {} }
    socket = null;
  }

  function connectSocket() {
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    manuallyClosed = false;
    setStatus("Connecting…", "connecting");

    let ws;
    try {
      ws = new WebSocket(wsUrl(currentRoom));
    } catch (e) {
      setStatus("Can't connect", "offline");
      scheduleReconnect();
      return;
    }
    socket = ws;

    ws.addEventListener("open", () => {
      if (ws !== socket) return;
      reconnectDelay = 1000;
      setStatus("Live", "online");
    });

    ws.addEventListener("message", (event) => {
      if (ws !== socket) return;
      let data;
      try { data = JSON.parse(event.data); } catch (e) { return; }
      if (data.type === "message") {
        const msg = data.message;
        appendMessage(msg, true);
        if (currentRoom.startsWith("dm:")) {
          loadSidebar();
          if (msg.author !== currentUser.username) {
            _seenByPeer.set(currentRoom, msg.id);
            updateSeenTicks();
          }
          if (msg.author === currentUser.username) updateSeenTicks();
        }
      } else if (data.type === "presence") {
        renderPresence(data.users);
      } else if (data.type === "global-presence") {
        applyGlobalPresence(data.statuses);
      } else if (data.type === "typing") {
        showTypingHint(data.username);
      } else if (data.type === "dm-notify") {
        // Pushed directly to this connection regardless of which room
        // it's subscribed to - if it's for a different conversation than
        // the one currently open, refresh the sidebar right away so the
        // unread badge appears instantly instead of waiting for the next
        // room switch.
        if (data.room !== currentRoom) loadSidebar();
      } else if (data.type === "notification") {
        // chat.html doesn't open the shared presence socket app.js uses on
        // every other page, so it needs its own handling of this too.
        handleIncomingNotification(data.notification);
      } else if (data.type === "call-offer" && data.from !== currentUser.username) {
        handleCallOffer(data.from || data.username, data.sdp);
      } else if (data.type === "call-answer" && data.from !== currentUser.username) {
        handleCallAnswer(data.from || data.username, data.sdp);
      } else if (data.type === "call-ice" && data.from !== currentUser.username) {
        handleCallIce(data.candidate);
      } else if (data.type === "call-reject" && data.from !== currentUser.username) {
        showToast("Call declined.");
        endCall(true);
      } else if (data.type === "call-end" && data.from !== currentUser.username) {
        endCall(true);
      }
    });

    ws.addEventListener("close", () => {
      if (ws !== socket || manuallyClosed) return;
      setStatus("Reconnecting…", "offline");
      scheduleReconnect();
    });

    ws.addEventListener("error", () => { ws.close(); });
  }

  function scheduleReconnect() {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(() => {
      reconnectTimer = null;
      connectSocket();
    }, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 15000);
  }

  async function loadHistory() {
    const log = document.getElementById("chatLog");
    log.innerHTML = `<div class="chat-empty">Loading…</div>`;
    seenMessageIds = new Set();
    lastRenderedDateKey = null;
    lastGroupAuthor = null;
    lastGroupTime = null;
    const url = `/api/chat/messages?room=${encodeURIComponent(currentRoom)}&limit=${HISTORY_LIMIT}`;
    const history = await apiFetch(url);
    if (!history) {
      log.innerHTML = `<div class="chat-empty">Couldn't load history — messages sent from here will still go out live.</div>`;
      return;
    }
    if (!history.length) {
      log.innerHTML = `<div class="chat-empty">No messages yet. Say hello.</div>`;
      return;
    }
    log.innerHTML = "";
    history.forEach(appendMessage);
    scrollToBottom(true);
    updateSeenTicks();
  }

  function sendMessage(text, imageUrl) {
    const trimmed = (text || "").trim();
    if (!trimmed && !imageUrl && !songPending) return;
    const reply = replyContext;
    clearReplyContext();

    // Build the payload
    const payload = { type: "send", body: trimmed, image: imageUrl || null, replyTo: reply };
    if (songPending) {
      payload.msgType = "song";
      payload.songData = songPending;
      payload.body = `🎵 ${songPending.name} — ${songPending.artists}`;
      songPending = null;
      hideSongSearch();
    }

    if (socket && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify(payload));
    } else {
      apiFetch("/api/chat/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ room: currentRoom, author: currentUser.username, ...payload })
      }).then(msg => {
        if (msg) { appendMessage(msg, true); if (currentRoom.startsWith("dm:")) loadSidebar(); }
      });
    }
  }

  function sendGameMessage(gameData) {
    const payload = {
      type: "send",
      body: `🎮 ${gameData.prompt}`,
      msgType: "game",
      gameData,

  // ── Swipe-to-reply ──────────────────────────────────────────────────────────

  function addSwipeToReply(msgEl, msg) {
    const THRESHOLD = 72;
    let startX = 0, startY = 0, isDragging = false, triggered = false;
    const bubbleCol = msgEl.querySelector(".chat-bubble-col");
    const arrow = msgEl.querySelector(".chat-reply-arrow");

    msgEl.addEventListener("touchstart", e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      isDragging = false;
      triggered = false;
    }, { passive: true });

    msgEl.addEventListener("touchmove", e => {
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      // Ignore mostly-vertical movement (user is scrolling)
      if (!isDragging && Math.abs(dx) < 8) return;
      if (Math.abs(dy) > Math.abs(dx) * 1.3) return;
      isDragging = true;
      if (dx <= 0) return; // only swipe right
      const capped = Math.min(dx, THRESHOLD + 10);
      if (bubbleCol) {
        bubbleCol.style.transition = "none";
        bubbleCol.style.transform = `translateX(${capped}px)`;
      }
      if (arrow) arrow.style.opacity = String(Math.min(1, capped / THRESHOLD));
      if (capped >= THRESHOLD && !triggered) {
        triggered = true;
        if (arrow) arrow.classList.add("show");
        if (navigator.vibrate) navigator.vibrate(12);
      }
    }, { passive: true });

    msgEl.addEventListener("touchend", () => {
      if (triggered) setReplyContext(msg);
      // Spring the bubble back
      if (bubbleCol) {
        bubbleCol.style.transition = "transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)";
        bubbleCol.style.transform = "";
      }
      if (arrow) { arrow.style.opacity = ""; arrow.classList.remove("show"); }
      isDragging = false; triggered = false;
    });
  }

  let listenRailTimer = null;
  let _listenRailLoading = false; // prevent overlapping concurrent fetches

  // Renders the sidebar "Listen Together" rail: any active sessions (so you
  // can join and sync your own Spotify to them), plus a start/end control
  // for the current user's own session. Re-used on a light poll and on the
  // "listen-session-updated" event app.js fires after join/leave/end/sync.
  // Applies fresh session data onto an already-rendered card without tearing
  // down its DOM node, so the progress bar's CSS transition keeps flowing
  // smoothly instead of snapping/glitching back on every ~8s poll.
  function updateListenCardInPlace(cardEl, session) {
    const hasProgress = typeof session.progressMs === "number" && typeof session.durationMs === "number" && session.durationMs > 0;
    cardEl.classList.toggle("is-playing", !!session.isPlaying);
    cardEl.classList.toggle("is-paused", !session.isPlaying);

    // The rail polls every second, but the server only actually refreshes a
    // session's real Spotify position occasionally (on join/sync/detail
    // fetch) - most polls return byte-for-byte the same progress snapshot.
    // Only reset the ticking baseline when something genuinely changed
    // server-side; otherwise leave it alone so the smooth per-second ticker
    // (tickNowPlayingWidgets) keeps advancing the bar uninterrupted instead
    // of being yanked back to the same value every second.
    const serverStamp = String(session.updatedAt || "");
    const trackUri    = session.trackUri || "";
    // Also detect song rotation via URI change — new track means we must reset the
    // ticker baseline even if updatedAt happened to be unchanged.
    const changed = cardEl.dataset.serverUpdatedAt !== serverStamp
      || cardEl.dataset.isPlaying !== (session.isPlaying ? "1" : "0")
      || cardEl.dataset.trackUri  !== trackUri;

    if (hasProgress && changed) {
      cardEl.dataset.durationMs      = session.durationMs;
      cardEl.dataset.progressMs      = session.progressMs;
      cardEl.dataset.fetchedAt       = Date.now();
      cardEl.dataset.isPlaying       = session.isPlaying ? "1" : "0";
      cardEl.dataset.serverUpdatedAt = serverStamp;
      cardEl.dataset.trackUri        = trackUri;
    } else if (!hasProgress) {
      delete cardEl.dataset.durationMs;
      delete cardEl.dataset.progressMs;
      delete cardEl.dataset.fetchedAt;
      delete cardEl.dataset.isPlaying;
      delete cardEl.dataset.serverUpdatedAt;
      cardEl.dataset.trackUri = trackUri; // keep for future rotation detection
    }
    const trackEl = cardEl.querySelector(".now-playing-track");
    const artistEl = cardEl.querySelector(".now-playing-artist");
    if (trackEl) trackEl.textContent = session.trackName || "Nothing playing yet";
    if (artistEl) artistEl.textContent = session.artistNames || "";
    const countEl = cardEl.querySelector(".listen-session-count");
    if (countEl) countEl.textContent = `${session.participants.length} listening`;
    const artImg = cardEl.querySelector("img");
    if (artImg && session.albumArt && artImg.src !== session.albumArt) artImg.src = session.albumArt;
  }

  async function loadListenRail() {
    if (_listenRailLoading) return; // don't stack concurrent requests
    const rail = document.getElementById("chatListenRail");
    if (!rail) return;
    _listenRailLoading = true;
    let sessions;
    try {
      // fetchListenSessions() hits the list endpoint (fast, no Spotify call).
      // Then we fetch each session individually — that endpoint calls Spotify
      // and updates the DB, giving us the real current track, progress, and
      // rotation when the host skips to the next song.
      const stubs = await fetchListenSessions();
      sessions = await Promise.all(
        stubs.map(s => fetchListenSession(s.id).catch(() => s))
      );
    } catch (e) {
      sessions = [];
    } finally {
      _listenRailLoading = false;
    }
    const mySession = sessions.find(s => s.hostUsername === currentUser.username);
    const otherSessions = sessions.filter(s => s.hostUsername !== currentUser.username);
    const ordered = [mySession, ...otherSessions].filter(Boolean);

    const hasSpotify = currentUser.spotifyAccount && currentUser.spotifyAccount.connected;
    const startControl = mySession
      ? ""
      : hasSpotify
        ? `<button type="button" class="btn primary" id="startListenBtn" style="width:100%;">Start listening together</button>`
        : `<a href="profile.html?tab=settings" class="field-note" style="display:block;">Connect Spotify to start a listening session</a>`;

    let cardsContainer = rail.querySelector("#chatListenCards");
    const existingIds = cardsContainer
      ? Array.from(cardsContainer.querySelectorAll("[data-session-id]")).map(el => el.dataset.sessionId)
      : [];
    const newIds = ordered.map(s => s.id);
    const sameSet = cardsContainer && existingIds.length === newIds.length && existingIds.every((id, i) => id === newIds[i]);

    if (sameSet) {
      // Nothing structurally changed (same sessions, same order) - update each
      // card's numbers in place instead of rebuilding the DOM.
      ordered.forEach(session => {
        const cardEl = cardsContainer.querySelector(`[data-session-id="${session.id}"]`);
        if (cardEl) updateListenCardInPlace(cardEl, session);
      });
      // The start/end control can still change (e.g. participant count on my
      // own session's button area) - only the title/cards were preserved above.
      let controlSlot = rail.querySelector("#chatListenControl");
      if (controlSlot) controlSlot.innerHTML = startControl;
    } else {
      const cards = ordered.map(s => renderListenSessionCard(s)).join("");
      rail.innerHTML = `
        <div class="chat-listen-rail-title">Listen Together</div>
        <div id="chatListenCards">${cards}</div>
        <div id="chatListenControl">${startControl}</div>
      `;
    }

    const startBtn = document.getElementById("startListenBtn");
    if (startBtn) {
      startBtn.addEventListener("click", async () => {
        startBtn.disabled = true;
        startBtn.textContent = "Starting…";
        const session = await createListenSession();
        if (session) {
          showToast("Listening session started. Friends can join from here.");
          loadListenRail();
        } else {
          showToast("Couldn't start a session. Make sure Spotify is connected and playing.");
          startBtn.disabled = false;
          startBtn.textContent = "Start listening together";
        }
      });
    }
  }

  // ── DM Listen-Together compact banner ───────────────────────────────────
  // When in a DM with someone who has an active listening session, show a

  let _dmListenPollTimer = null;
  const SPOTIFY_ICON_SVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="#1DB954"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>`;

  async function updateDmListenBanner() {
    const banner = document.getElementById("dmListenBanner");
    if (!banner || !currentPeer) { if (banner) banner.style.display = "none"; return; }

    // Fetch session list and peer user data in parallel — neither depends on
    // the other, so there's no reason to wait for one before the other.
    const [sessions, peerUser] = await Promise.all([
      fetchListenSessions(),
      (async () => {
        let u = Progress.getUser(currentPeer);
        if (!u || !u.id) {
          // Not in local cache yet — fetch from API
          const r = await apiFetch(`/api/users?username=${encodeURIComponent(currentPeer)}`).catch(() => null);
          u = Array.isArray(r) ? r[0] : r;
        }
        return u || null;
      })()
    ]);

    const peerSession = sessions.find(s => s.hostUsername === currentPeer) || null;
    const peerId = peerUser && peerUser.id;

    // Fetch live now-playing directly from Spotify — works even without a
    // formal listen-together session, so the banner appears whenever the peer
    // is playing anything.
    let np = null;
    if (peerId) {
      const npData = await apiFetch(`/api/users/${encodeURIComponent(peerId)}/spotify/now-playing`).catch(() => null);
      if (npData && npData.playing) np = npData.playing;
    }

    // Nothing to show: no session and not actively playing → hide
    if (!peerSession && (!np || !np.isPlaying)) {
      banner.style.display = "none";
      clearTimeout(_dmListenPollTimer);
      _dmListenPollTimer = setTimeout(updateDmListenBanner, 5000);
      return;
    }

    // Prefer live Spotify data; fall back to session cache
    const trackName   = (np && np.trackName)   || (peerSession && peerSession.trackName)   || "Listening to something";
    const artistNames = (np && np.artistNames)  || (peerSession && peerSession.artistNames) || "";
    const albumArt    = (np && np.albumArt)     || (peerSession && peerSession.albumArt)    || null;
    const isPlaying   = np ? !!np.isPlaying     : (peerSession && peerSession.isPlaying !== false);
    const progressMs  = (np && typeof np.progressMs === "number") ? np.progressMs : (peerSession ? peerSession.progressMs || 0 : 0);
    const durationMs  = (np && typeof np.durationMs === "number") ? np.durationMs : (peerSession ? peerSession.durationMs || 0 : 0);

    const viewer = Progress.getCurrentUser();
    const joined = viewer && peerSession && peerSession.participants.includes(viewer.username);

    banner.style.display = "flex";
    banner.className = `dm-listen-banner${isPlaying ? "" : " is-paused"}`;

    const hasProg = durationMs > 0;
    const pct = hasProg ? Math.min(100, (progressMs / durationMs) * 100) : 0;
    if (hasProg) {
      banner.dataset.durationMs = durationMs;
      banner.dataset.progressMs = progressMs;
      banner.dataset.fetchedAt  = Date.now();
      banner.dataset.isPlaying  = isPlaying ? "1" : "0";
    } else {
      delete banner.dataset.durationMs;
    }

    const artEl = albumArt
      ? `<img class="dm-listen-art" src="${escapeHTML(albumArt)}" alt="">`
      : `<div class="dm-listen-art-fallback">${SPOTIFY_ICON_SVG}</div>`;

    // Action buttons only appear when a formal listen-together session exists.
    // When the banner is just showing passive now-playing, no buttons are shown.
    const actionButtons = peerSession
      ? (joined
          ? `<button type="button" class="dm-listen-action" data-action="sync" data-id="${peerSession.id}">Sync</button>
             <button type="button" class="dm-listen-action dm-listen-leave" data-action="leave" data-id="${peerSession.id}">Leave</button>`
          : `<button type="button" class="dm-listen-action" data-action="join" data-id="${peerSession.id}">Join</button>`)
      : "";

    banner.innerHTML = `
      ${artEl}
      <div class="dm-listen-eq"><span></span><span></span><span></span></div>
      <div class="dm-listen-info">
        <span class="dm-listen-banner-track">${escapeHTML(trackName)}</span>
        <span class="dm-listen-banner-artist">${escapeHTML(artistNames)}</span>
        ${hasProg ? `<div class="dm-listen-progress">
          <div class="dm-listen-progress-fill" style="width:${pct.toFixed(2)}%"></div>
        </div>` : ""}
      </div>
      ${actionButtons ? `<div class="dm-listen-actions">${actionButtons}</div>` : ""}
    `;

    banner.querySelectorAll(".dm-listen-action").forEach(btn => {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        if (btn.dataset.action === "join") {
          await joinListenSession(btn.dataset.id);
          await syncMeToListenSession(btn.dataset.id);
          showToast("Joined and synced!");
        } else if (btn.dataset.action === "sync") {
          const r = await syncMeToListenSession(btn.dataset.id);
          showToast(r.synced ? "Synced!" : (r.reason || "Couldn't sync."));
        } else if (btn.dataset.action === "leave") {
          await leaveListenSession(btn.dataset.id);
        }
        updateDmListenBanner();
      });
    });

    clearTimeout(_dmListenPollTimer);
    _dmListenPollTimer = setTimeout(updateDmListenBanner, 5000);
  }

  // Populates the chat emoji popup (reusing the same emoticon set as
  // everywhere else in the app) and wires up: toggling it open/closed,
  // inserting a :name: token at the current cursor position on click, and
  // closing it on an outside click or after sending a message.
  let chatEmojiDocListenerAttached = false;

  // Sets up chat's sticker picker: builds the button grid, wires each one to
  // insert a :name: token at the cursor, and attaches the same hover-preview
  // tooltip used by the reply-form picker on post.html. The document-level
  // outside-click listener is only ever attached once (guarded by the flag
  // above) even though this function itself re-runs on every renderChat(),
  // so re-renders can't stack up duplicate close handlers.
  function setupChatEmojiPicker() {
    const picker = document.getElementById("chatEmojiPicker");
    const toggleBtn = document.getElementById("chatEmojiBtn");
    if (!picker || !toggleBtn) return;

    picker.innerHTML = getEmoticonNames().map(name => `

    let tooltip = document.getElementById("chatEmojiTooltip");
    if (!tooltip) {
      tooltip = document.createElement("div");
      tooltip.id = "chatEmojiTooltip";
      tooltip.className = "emoji-tooltip hidden";
      document.body.appendChild(tooltip);
    }

    picker.querySelectorAll(".emoji-btn").forEach(btn => {
      const name = btn.dataset.name || "";

      btn.addEventListener("mouseenter", () => {
        tooltip.innerHTML = `
          <img src="images/emoticons/${name}.png" alt="${name}">
          <div class="emoji-tooltip-label${name.length > 10 ? " long-name" : ""}">:${name}:</div>
        `;
        tooltip.classList.remove("hidden");
        const rect = btn.getBoundingClientRect();
        const tooltipWidth = 120;
        const gap = 12;
        const left = Math.min(window.innerWidth - tooltipWidth - 12, Math.max(12, rect.left + rect.width / 2 - tooltipWidth / 2));
        const top = rect.top - tooltip.offsetHeight - gap;
        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top < 12 ? rect.bottom + gap : top}px`;
      });
      btn.addEventListener("mouseleave", () => tooltip.classList.add("hidden"));

      btn.addEventListener("click", () => {
        const textarea = document.getElementById("chatInput");
        if (!textarea) return;
        const placeholder = `:${name}:`;
        const start = textarea.selectionStart ?? textarea.value.length;
        const end = textarea.selectionEnd ?? textarea.value.length;
        const value = textarea.value;
        textarea.value = value.slice(0, start) + placeholder + value.slice(end);
        textarea.focus();
        textarea.selectionStart = textarea.selectionEnd = start + placeholder.length;
      });
    });

    toggleBtn.onclick = (e) => {
      e.stopPropagation();
      picker.classList.toggle("open");
    };

    picker.onclick = (e) => e.stopPropagation();

    if (!chatEmojiDocListenerAttached) {
      document.addEventListener("click", closeChatEmojiPicker);
      chatEmojiDocListenerAttached = true;
    }
  }

  function closeChatEmojiPicker() {
    const picker = document.getElementById("chatEmojiPicker");

  async function start() {
    initShell("chat");

    // Use whatever's already in localStorage — no waiting
    currentUser = Progress.getCurrentUser();

    if (!currentUser) {
        // Not logged in locally either — show logged-out state,
        // then try once more after the API responds
        renderLoggedOut();
        Progress.loadFromApi().then(() => {
            currentUser = Progress.getCurrentUser();
            if (currentUser) start();
        }).catch(() => {});
        return;
    }

    const params = new URLSearchParams(location.search);
    const withUsername = params.get("with");
    if (withUsername && withUsername.toLowerCase() !== currentUser.username.toLowerCase()) {
        currentRoom = dmRoomId(currentUser.username, withUsername);
        currentPeer = withUsername;
    }

    renderChat();
    if (currentPeer) {
        document.getElementById("chatRoomTitle").textContent = `@${currentPeer}`;
    }
    // Refresh in the background — don't block anything on it
    Progress.loadFromApi().catch(() => {});
}

  function closeListenRailPolling() {
    if (listenRailTimer) { clearInterval(listenRailTimer); listenRailTimer = null; }
  }


  /* ============================================================
     WEBRTC VOICE CALL SYSTEM
     Signaling goes through the existing DM WebSocket room.
     Audio streams go peer-to-peer via WebRTC.
     ============================================================ */

  const ICE_SERVERS = [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" },
    { urls: "stun:stun2.l.google.com:19302" }
  ];

  let _callState = null; // null | "calling" | "receiving" | "connected"
  let _peerConn   = null;
  let _localStream = null;
  let _callPeer   = null;
  let _callTimer  = null;
  let _pendingOffer = null; // SDP from incoming offer, saved until user accepts

  function sendSignal(type, extra) {
    if (!socket || socket.readyState !== WebSocket.OPEN) return;
    socket.send(JSON.stringify({ type, from: currentUser.username, ...extra }));
  }

  async function startCall(targetUsername) {
    if (_callState) { showToast("Already in a call."); return; }
    if (!navigator.mediaDevices) { showToast("Your browser doesn't support voice calls."); return; }
    try {
      _localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    } catch (e) {
      showToast("Couldn't access your microphone. Check browser permissions.");
      return;
    }
    _callPeer  = targetUsername;
    _callState = "calling";
    renderCallOverlay("calling");

    _peerConn = buildPeerConn(targetUsername);
    _localStream.getTracks().forEach(t => _peerConn.addTrack(t, _localStream));
    _peerConn.onicecandidate = e => { if (e.candidate) sendSignal("call-ice", { candidate: e.candidate }); };

    const offer = await _peerConn.createOffer();
    await _peerConn.setLocalDescription(offer);
    sendSignal("call-offer", { sdp: offer });
  }

  function buildPeerConn(peer) {
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    pc.ontrack = e => {
      let audio = document.getElementById("callRemoteAudio");
      if (!audio) {
        audio = document.createElement("audio");
        audio.id = "callRemoteAudio";
        audio.autoplay = true;
        document.body.appendChild(audio);
      }
      audio.srcObject = e.streams[0];
    };
    pc.onconnectionstatechange = () => {
      if (["disconnected","failed","closed"].includes(pc.connectionState)) {
        if (_callState === "connected") endCall(true);
      }
    };
    return pc;
  }

  async function handleCallOffer(from, sdp) {
    if (_callState) {
      // Already busy — auto-reject
      sendSignal("call-reject", {});
      return;
    }
    _callPeer = from;
    _callState = "receiving";
    _pendingOffer = sdp;
    renderCallOverlay("receiving");
    // Play a ring sound if we have the notification sound
    try { new Audio("sounds/notification.mp3").play().catch(() => {}); } catch(e) {}
  }

  async function acceptCall() {
    if (!_pendingOffer) return;
    if (!navigator.mediaDevices) { showToast("Your browser doesn't support voice calls."); rejectCall(); return; }
    try {
      _localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    } catch (e) {
      showToast("Couldn't access your microphone.");
      rejectCall();
      return;
    }
    _callState = "connected";
    _peerConn = buildPeerConn(_callPeer);
    _localStream.getTracks().forEach(t => _peerConn.addTrack(t, _localStream));
    _peerConn.onicecandidate = e => { if (e.candidate) sendSignal("call-ice", { candidate: e.candidate }); };
    await _peerConn.setRemoteDescription(new RTCSessionDescription(_pendingOffer));
    const answer = await _peerConn.createAnswer();
    await _peerConn.setLocalDescription(answer);
    sendSignal("call-answer", { sdp: answer });
    _pendingOffer = null;
    renderCallOverlay("connected");
    startCallTimer();
  }

  function rejectCall() {
    sendSignal("call-reject", {});
    endCall(true);
  }

  async function handleCallAnswer(from, sdp) {
    if (!_peerConn) return;
    await _peerConn.setRemoteDescription(new RTCSessionDescription(sdp));
    _callState = "connected";
    renderCallOverlay("connected");
    startCallTimer();
  }

  async function handleCallIce(candidate) {
    if (!_peerConn) return;
    try { await _peerConn.addIceCandidate(new RTCIceCandidate(candidate)); } catch (e) {}
  }

  function endCall(silent) {
    if (!silent) sendSignal("call-end", {});
    if (_peerConn) { _peerConn.close(); _peerConn = null; }
    if (_localStream) { _localStream.getTracks().forEach(t => t.stop()); _localStream = null; }
    clearInterval(_callTimer); _callTimer = null;
    _callState = null; _callPeer = null; _pendingOffer = null;
    const audio = document.getElementById("callRemoteAudio");
    if (audio) { audio.srcObject = null; audio.remove(); }
    const overlay = document.getElementById("callOverlay");
    if (overlay) { overlay.classList.remove("open"); setTimeout(() => overlay.remove(), 300); }
  }

  function startCallTimer() {
    let secs = 0;
    _callTimer = setInterval(() => {
      secs++;
      const m = Math.floor(secs / 60);
      const s = String(secs % 60).padStart(2, "0");
      const el = document.getElementById("callTimerEl");
      if (el) el.textContent = `${m}:${s}`;
    }, 1000);
  }

  let _muted = false;
  function toggleMute() {
    _muted = !_muted;
    if (_localStream) _localStream.getAudioTracks().forEach(t => t.enabled = !_muted);
    const muteBtn = document.getElementById("callMuteBtn");
    if (muteBtn) {
      muteBtn.classList.toggle("active", _muted);
      muteBtn.title = _muted ? "Unmute" : "Mute";
    }
  }

  function renderCallOverlay(state) {
    let overlay = document.getElementById("callOverlay");
    if (!overlay) {
      overlay = document.createElement("div");
      overlay.id = "callOverlay";
      overlay.className = "call-overlay";
      document.body.appendChild(overlay);
    }
    const user = Progress.getUser(_callPeer);
    const name = escapeHTML((user && user.name) || _callPeer || "Unknown");
    const av = avatarHTML(user, 72);
    const stateLabel = { calling: "Calling…", receiving: "Incoming call", connected: "Connected" }[state] || state;

    overlay.innerHTML = `
      <div class="call-card">
        <div class="call-avatar-wrap">${av}</div>
        <div class="call-name">${name}</div>
        <div class="call-state-label">${stateLabel}${state === "connected" ? ' · <span id="callTimerEl">0:00</span>' : ''}</div>
        <div class="call-controls">
          ${state === "receiving" ? `
            <button type="button" class="call-ctrl call-ctrl-accept" id="callAcceptBtn" title="Accept">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
            </button>
          ` : ""}
          ${state === "connected" ? `
            <button type="button" class="call-ctrl call-ctrl-mute" id="callMuteBtn" title="Mute">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            </button>
          ` : ""}
          <button type="button" class="call-ctrl call-ctrl-end" id="callEndBtn" title="${state === "receiving" ? "Decline" : "End call"}">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 6.5a9 9 0 0 0-11 0l-2-2A12 12 0 0 1 12 1a12 12 0 0 1 7.5 3.5l-2 2zm-8.8 3.3a5 5 0 0 1 6.6 0l2-2a8 8 0 0 0-10.6 0l2 2zM15.9 12l2-2a5 5 0 0 0-.4-.5L15.4 11.6c.2.1.4.3.5.4zm-2.4 2.4L12 15.9l-1.5-1.5a5 5 0 0 1-.4-.5L12 12l1.9 1.9a5 5 0 0 1-.4.5z" transform="rotate(135 12 12)"/><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
          </button>
        </div>
      </div>`;
    overlay.classList.add("open");
    const acceptBtn = document.getElementById("callAcceptBtn");
    if (acceptBtn) acceptBtn.addEventListener("click", acceptCall);
    const endBtn = document.getElementById("callEndBtn");
    if (endBtn) endBtn.addEventListener("click", () => { if (_callState === "receiving") rejectCall(); else endCall(); });
    const muteBtn = document.getElementById("callMuteBtn");
    if (muteBtn) muteBtn.addEventListener("click", toggleMute);
  }

  window.addEventListener("beforeunload", () => { closeSocket(); closeListenRailPolling(); endCall(true); });

  start();
</script>

</body>
</html>
