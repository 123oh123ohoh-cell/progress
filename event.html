<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Event — Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>(function(){try{var t=localStorage.getItem("progressTheme");var dark=(t==="dark")||(t!=="light"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(dark)document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<style>
html { scroll-behavior: smooth; }

/* ── Hero ─────────────────────────────────────────────── */
.ev-hero {
  position: relative; overflow: hidden; color: #fff;
  min-height: min(72vh, 620px);
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 0 0 52px;
  background-size: 300% 300%;
  animation: ev-grad 10s ease infinite;
}
@keyframes ev-grad {
  0%,100% { background-position: 0% 60%; }
  33%      { background-position: 100% 40%; }
  66%      { background-position: 50% 100%; }
}
#heroCanvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.ev-hero-scrim {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(to bottom, rgba(0,0,0,.04) 0%, rgba(0,0,0,.10) 40%, rgba(0,0,0,.52) 100%);
}
.ev-hero-shimmer {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(108deg, transparent 30%, rgba(255,255,255,.1) 50%, transparent 70%);
  animation: ev-shimmer 5s ease-in-out infinite;
}
@keyframes ev-shimmer { 0%{transform:translateX(-120%)} 100%{transform:translateX(220%)} }
.ev-hero-inner {
  position: relative; z-index: 2;
  max-width: 760px; margin: 0 auto; padding: 0 24px; width: 100%;
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
.ev-live-badge {
  display: inline-flex; align-items: center; gap: 7px;
  background: rgba(255,255,255,.18); backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,.32); border-radius: 30px; padding: 6px 16px;
  font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .14em;
  margin-bottom: 28px; margin-top: 100px;
  animation: ev-fadein .6s cubic-bezier(.34,1.56,.64,1) both;
}
.ev-live-dot {
  width: 8px; height: 8px; border-radius: 50%; background: #fff;
  animation: ev-ping 1.3s cubic-bezier(.4,0,.6,1) infinite;
}
@keyframes ev-ping {
  0%   { box-shadow: 0 0 0 0 rgba(255,255,255,.7); }
  70%  { box-shadow: 0 0 0 8px rgba(255,255,255,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
}
.ev-emoji-wrap { position: relative; display: inline-block; margin-bottom: 20px; animation: ev-fadein .7s .1s cubic-bezier(.34,1.56,.64,1) both; }
.ev-emoji { font-size: clamp(64px,12vw,96px); line-height: 1; display: block; }
.ev-halo { position: absolute; inset: -14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.22); animation: ev-halo 2.2s ease-out infinite; }
.ev-halo:nth-child(2) { inset: -28px; border-color: rgba(255,255,255,.12); animation-delay: .7s; }
.ev-halo:nth-child(3) { inset: -44px; border-color: rgba(255,255,255,.06); animation-delay: 1.4s; }
@keyframes ev-halo { 0%{transform:scale(.85);opacity:0} 20%{opacity:1} 100%{transform:scale(1.25);opacity:0} }
.ev-title {
  font-family: var(--font-display); font-weight: 600; font-style: italic;
  font-size: clamp(38px,8vw,72px); margin: 0 0 14px; line-height: 1.0;
  background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,.75) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  filter: drop-shadow(0 2px 18px rgba(0,0,0,.25));
  animation: ev-fadein .7s .2s cubic-bezier(.34,1.56,.64,1) both;
}
.ev-desc { font-size: clamp(14px,2.2vw,16px); color: rgba(255,255,255,.85); max-width: 480px; line-height: 1.65; margin: 0 0 32px; animation: ev-fadein .7s .3s both; }
.ev-countdown { display: flex; align-items: center; gap: 10px; margin-bottom: 36px; }
.ev-cd-unit { background: rgba(0,0,0,.35); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.15); border-radius: 14px; padding: 10px 16px; text-align: center; min-width: 62px; }
.ev-cd-num { font-family: var(--font-mono); font-size: clamp(22px,4vw,32px); font-weight: 700; color: #fff; line-height: 1; display: block; transition: transform .1s cubic-bezier(.34,1.56,.64,1); }
.ev-cd-num.tick { transform: scale(1.15); }
.ev-cd-label { font-size: 9px; text-transform: uppercase; letter-spacing: .12em; color: rgba(255,255,255,.55); display: block; margin-top: 4px; }
.ev-cd-sep { font-size: 24px; font-weight: 700; color: rgba(255,255,255,.3); }
.ev-play-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; animation: ev-fadein .7s .4s cubic-bezier(.34,1.56,.64,1) both; }
.ev-play-ring { position: absolute; inset: -12px; border-radius: 50px; border: 2px solid rgba(255,255,255,.3); animation: ev-play-ping 2s ease-out infinite; }
.ev-play-ring:nth-child(2) { animation-delay: .65s; }
@keyframes ev-play-ping { 0%{transform:scale(.9);opacity:.6} 100%{transform:scale(1.35);opacity:0} }
.ev-play-btn {
  position: relative; z-index: 1;
  display: inline-flex; align-items: center; gap: 12px;
  background: #fff; color: #1a1a1a; border: none; border-radius: 50px;
  padding: 18px 40px; font-size: clamp(16px,2.5vw,20px); font-weight: 800;
  cursor: pointer; font-family: var(--font-body); letter-spacing: .01em;
  box-shadow: 0 8px 32px rgba(0,0,0,.28);
  transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s;
  -webkit-tap-highlight-color: transparent;
}
.ev-play-btn:active { transform: scale(.96); }
@media (hover:hover) { .ev-play-btn:hover { transform: scale(1.05); box-shadow: 0 14px 40px rgba(0,0,0,.32); } }
.ev-prize { margin-top: 20px; display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28); border-radius: 30px; padding: 6px 16px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.9); backdrop-filter: blur(8px); }
.ev-personal-best { margin-top: 16px; font-size: 13px; color: rgba(255,255,255,.7); font-family: var(--font-mono); }
.ev-personal-best strong { color: #fff; }
.ev-login-note { margin-top: 12px; font-size: 13px; color: rgba(255,255,255,.7); }
.ev-login-note a { color: #fff; font-weight: 700; }
@keyframes ev-fadein { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

/* ── Stats / Leaderboard / Wrap ───────────────────────── */
.ev-wrap { max-width: 860px; margin: 0 auto; padding: 0 16px 120px; }
.ev-stats-bar { display: flex; gap: 12px; flex-wrap: nowrap; padding: 28px 0 28px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.ev-stats-bar::-webkit-scrollbar { display: none; }
.ev-stat { background: var(--mocha-wash); border-radius: 18px; padding: 18px 22px; flex: 1 0 130px; display: flex; flex-direction: column; gap: 5px; transition: transform .2s cubic-bezier(.34,1.56,.64,1); }
@media (hover:hover) { .ev-stat:hover { transform: translateY(-3px); } }
.ev-stat-icon { font-size: 20px; }
.ev-stat-num { font-family: var(--font-mono); font-size: 28px; font-weight: 700; color: var(--ink); line-height: 1; }
.ev-stat-label { font-size: 12px; color: var(--muted); }
.ev-section { padding: 0 0 32px; }
.ev-section-title { font-family: var(--font-display); font-size: 22px; font-style: italic; font-weight: 600; margin: 0 0 18px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.ev-lb-wrap { background: var(--mocha-wash); border-radius: 20px; padding: 24px; }
.ev-lb-podium { display: flex; gap: 10px; margin-bottom: 18px; }
.ev-lb-pod-card { flex: 1; border-radius: 16px; padding: 16px 10px; text-align: center; position: relative; overflow: hidden; transition: transform .2s cubic-bezier(.34,1.56,.64,1); }
@media (hover:hover) { .ev-lb-pod-card:hover { transform: translateY(-3px); } }
.ev-lb-pod-card.gold   { background: linear-gradient(145deg,#ffe259,#ffa751); box-shadow: 0 6px 22px rgba(255,167,81,.35); }
.ev-lb-pod-card.silver { background: linear-gradient(145deg,#e0e0e0,#a8a8a8); }
.ev-lb-pod-card.bronze { background: linear-gradient(145deg,#e8a87c,#c17a3a); }
.ev-lb-pod-card.gold::after { content:""; position:absolute; inset:0; background: linear-gradient(108deg,transparent 35%,rgba(255,255,255,.25) 50%,transparent 65%); animation: ev-shimmer 3s ease-in-out infinite; }
.ev-lb-pod-medal { font-size: 24px; display: block; margin-bottom: 8px; }
.ev-lb-pod-init { width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:rgba(0,0,0,.6);margin:0 auto 8px; }
.ev-lb-pod-name { font-size: 12px; font-weight: 700; color: rgba(0,0,0,.65); line-height: 1.2; }
.ev-lb-pod-score { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: rgba(0,0,0,.5); margin-top: 3px; }
.ev-lb-row { display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--mocha-light);opacity:0;transform:translateX(10px);transition:opacity .35s,transform .35s; }
.ev-lb-row.visible { opacity:1;transform:translateX(0); }
.ev-lb-row:last-child { border-bottom:none; }
.ev-lb-rank { font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--muted);min-width:22px;text-align:center; }
.ev-lb-av-init { width:30px;height:30px;border-radius:50%;background:var(--mocha-light);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--muted);flex-shrink:0; }
.ev-lb-name { font-size:13px;font-weight:600;color:var(--ink);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.ev-lb-you { font-size:9px;background:var(--ink);color:var(--cream);border-radius:4px;padding:1px 5px;font-weight:800;margin-left:4px; }
.ev-lb-score-wrap { display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0; }
.ev-lb-score { font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--ink); }
.ev-lb-bar-wrap { width:60px;height:3px;background:var(--mocha-light);border-radius:2px;margin-top:4px;overflow:hidden; }
.ev-lb-bar { height:100%;border-radius:2px;background:linear-gradient(90deg,#ff6b9d,#ffd93d);width:0;transition:width .8s cubic-bezier(.4,0,.2,1); }
.ev-lb-footer { margin-top:16px;display:flex;flex-direction:column;gap:9px; }
.ev-lb-user-rank { text-align:center;padding:11px;background:var(--mocha-light);border-radius:12px;font-size:13px;color:var(--muted); }
.ev-lb-user-rank strong { color:var(--ink); }
.ev-lb-empty { text-align:center;padding:32px 0;color:var(--muted);font-size:14px; }
.ev-lb-refresh { width:100%;padding:10px;border-radius:12px;border:1.5px solid var(--mocha-light);background:none;color:var(--muted);font-size:13px;cursor:pointer;font-family:var(--font-body);transition:border-color .15s,color .15s; }
.ev-lb-refresh:hover { border-color:var(--ink);color:var(--ink); }
.ev-none { text-align:center;padding:100px 24px; }
.ev-none-emoji { font-size:56px;display:block;margin-bottom:18px; }
.ev-none-title { font-family:var(--font-display);font-size:28px;font-style:italic;margin:0 0 10px;color:var(--ink); }
.ev-none-sub { color:var(--muted);font-size:14px; }

/* ═══════════════════════════════════════════════════════
   JELLY BLOB STYLES
═══════════════════════════════════════════════════════ */
.jelly {
  width: 100%; height: 100%;
  border-radius: 44% 44% 50% 50%;
  position: relative; overflow: hidden;
  transition: transform .16s cubic-bezier(.34,1.56,.64,1);
  will-change: transform;
}
/* Highlight blob on top */
.jelly-shine {
  position: absolute; top: 6%; left: 14%; width: 38%; height: 30%;
  background: rgba(255,255,255,.55); border-radius: 50%;
  filter: blur(2px); pointer-events: none;
}
/* Bottom sheen */
.jelly-sheen {
  position: absolute; bottom: 0; left: 0; right: 0; height: 30%;
  background: rgba(0,0,0,.12); border-radius: 0 0 50% 50%;
  pointer-events: none;
}
/* Eyes */
.jelly-eye {
  position: absolute; top: 26%; width: 23%; height: 28%;
  background: #fff; border-radius: 50%;
  box-shadow: 0 2px 4px rgba(0,0,0,.2);
}
.jelly-eye.l { left: 15%; }
.jelly-eye.r { right: 15%; }
/* Pupil */
.jelly-eye::after {
  content: ''; position: absolute;
  top: 18%; left: 16%; width: 46%; height: 48%;
  background: #111; border-radius: 50%;
}
/* Pupil shine */
.jelly-eye::before {
  content: ''; position: absolute;
  top: 9%; right: 12%; width: 28%; height: 28%;
  background: rgba(255,255,255,.9); border-radius: 50%; z-index: 1;
}
/* Worried/squished eyes when selected */
.gfs-cell.selected .jelly-eye {
  height: 22%;
  border-radius: 50% 50% 40% 40%;
}

/* ═══════════════════════════════════════════════════════
   FULLSCREEN GAME OVERLAY
═══════════════════════════════════════════════════════ */
#gfsOverlay {
  position: fixed; inset: 0; z-index: 1000;
  display: none; flex-direction: column;
  overscroll-behavior: none; overflow: hidden;
  opacity: 0; transition: opacity .25s cubic-bezier(.4,0,.2,1);
  /* Bright pastel candy background */
  background: linear-gradient(160deg, #a8edea 0%, #fed6e3 100%);
}
#gfsOverlay.open { opacity: 1; }
/* Candy particle canvas */
#gfsCanvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: .35; }

/* Close button */
.gfs-close {
  position: fixed; top: max(env(safe-area-inset-top,0px),14px); right: 16px; z-index: 10;
  background: rgba(255,255,255,.7); backdrop-filter: blur(8px);
  border: none; border-radius: 50%; width: 42px; height: 42px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 18px; color: #555;
  box-shadow: 0 2px 10px rgba(0,0,0,.12);
  transition: transform .15s cubic-bezier(.34,1.56,.64,1);
  -webkit-tap-highlight-color: transparent;
}
.gfs-close:active { transform: scale(.88); }

/* Inner layout */
.gfs-inner {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center;
  height: 100dvh;
  padding: max(env(safe-area-inset-top,0px),16px) 10px max(env(safe-area-inset-bottom,0px),10px);
  gap: 6px;
}

/* HUD — score + moves */
.gfs-hud {
  width: 100%; max-width: 440px;
  display: flex; align-items: stretch; justify-content: space-between; gap: 10px;
}
.gfs-hud-pill {
  flex: 1; background: rgba(255,255,255,.75); backdrop-filter: blur(8px);
  border-radius: 18px; padding: 10px 16px;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
}
.gfs-hud-label {
  font-size: 9.5px; text-transform: uppercase; letter-spacing: .14em;
  color: #888; font-weight: 700;
}
.gfs-score-val {
  font-family: var(--font-mono); font-size: clamp(26px,5.5vw,36px);
  font-weight: 800; color: #333; line-height: 1;
}
.gfs-moves-val {
  font-family: var(--font-mono); font-size: clamp(26px,5.5vw,36px);
  font-weight: 800; line-height: 1; color: #333;
  transition: color .2s, transform .15s cubic-bezier(.34,1.56,.64,1);
}
.gfs-moves-val.low { color: #e53935; animation: gfs-wobble .4s cubic-bezier(.34,1.56,.64,1); }
@keyframes gfs-wobble { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }

/* Combo flash */
.gfs-combo {
  height: 32px; display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-style: italic; font-size: 20px;
  font-weight: 600; color: #e91e8c; pointer-events: none;
  text-shadow: 0 2px 10px rgba(233,30,140,.3);
}
.gfs-combo-msg { animation: gfs-combo-in .3s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes gfs-combo-in {
  from { transform: scale(.4) translateY(10px); opacity: 0; }
  to   { transform: scale(1) translateY(0); opacity: 1; }
}

/* Board */
.gfs-board {
  display: grid; grid-template-columns: repeat(8,1fr);
  gap: 5px; padding: 10px;
  background: #5eba3a;
  border-radius: 20px;
  border: 4px solid #4da82e;
  box-shadow: 0 4px 0 #3a8c1e, 0 8px 24px rgba(0,0,0,.18);
  width: 100%; max-width: 440px;
  touch-action: none; user-select: none;
}
.gfs-cell {
  aspect-ratio: 1; border-radius: 10px; padding: 3px;
  cursor: pointer;
  background: rgba(255,255,255,.1);
  transition: transform .14s cubic-bezier(.34,1.56,.64,1);
  -webkit-tap-highlight-color: transparent;
  position: relative;
}
.gfs-cell.selected {
  transform: scale(1.14);
  background: rgba(255,255,255,.3);
  box-shadow: 0 0 0 3px #fff, 0 4px 18px rgba(0,0,0,.2);
  z-index: 2;
}
.gfs-cell.matched { animation: gfs-pop .28s cubic-bezier(.55,0,1,.45) forwards; }
@keyframes gfs-pop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.35); filter: brightness(1.8) saturate(1.5); }
  100% { transform: scale(0); opacity: 0; }
}
/* White burst on match */
.gfs-burst {
  position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 70%);
  animation: gfs-burst-anim .35s ease-out forwards; z-index: 5;
}
@keyframes gfs-burst-anim {
  from { transform: scale(0); opacity: 1; }
  to   { transform: scale(2.5); opacity: 0; }
}
.gfs-cell.dropping { animation: gfs-drop .22s cubic-bezier(.34,1.56,.64,1); }
@keyframes gfs-drop {
  from { transform: translateY(-28px) scale(.75); opacity: .4; }
  to   { transform: translateY(0) scale(1); opacity: 1; }
}
.gfs-cell.invalid-swap { animation: gfs-shake .28s cubic-bezier(.36,.07,.19,.97); }
@keyframes gfs-shake {
  0%,100% { transform: translateX(0); }
  20%     { transform: translateX(-5px); }
  60%     { transform: translateX(5px); }
  80%     { transform: translateX(-3px); }
}
.gfs-cell.hint-glow .jelly { animation: gfs-hint .5s cubic-bezier(.34,1.56,.64,1) 3; }
@keyframes gfs-hint { 0%,100%{transform:scale(1)} 50%{transform:scale(1.25) rotate(10deg)} }

/* Controls */
.gfs-controls { display: flex; gap: 10px; width: 100%; max-width: 440px; justify-content: center; }
.gfs-hint-btn {
  background: rgba(255,255,255,.7); backdrop-filter: blur(6px);
  border: none; border-radius: 30px; padding: 10px 26px;
  font-size: 14px; font-weight: 700; cursor: pointer; color: #555;
  font-family: var(--font-body); box-shadow: 0 2px 8px rgba(0,0,0,.1);
  transition: transform .15s cubic-bezier(.34,1.56,.64,1);
  -webkit-tap-highlight-color: transparent;
}
.gfs-hint-btn:active { transform: scale(.94); }
.gfs-hint-btn:disabled { opacity: .38; pointer-events: none; }

/* Results */
.gfs-results {
  position: absolute; inset: 0; z-index: 4;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 32px 24px; text-align: center;
  background: rgba(255,255,255,.85); backdrop-filter: blur(16px);
  opacity: 0; pointer-events: none;
  transition: opacity .4s cubic-bezier(.4,0,.2,1);
}
.gfs-results.show { opacity: 1; pointer-events: all; }
/* Big jelly result character */
.gfs-res-jelly {
  width: 90px; height: 90px; border-radius: 44% 44% 50% 50%;
  position: relative; overflow: hidden; margin: 0 auto 20px;
  animation: gfs-res-bounce .6s cubic-bezier(.34,1.56,.64,1) both;
  box-shadow: 0 8px 24px rgba(0,0,0,.18);
}
@keyframes gfs-res-bounce { from{transform:scale(0) rotate(-10deg)} to{transform:scale(1) rotate(0)} }
.gfs-res-jelly-shine { position:absolute;top:6%;left:14%;width:38%;height:30%;background:rgba(255,255,255,.6);border-radius:50%;filter:blur(3px); }
.gfs-res-jelly-sheen { position:absolute;bottom:0;left:0;right:0;height:28%;background:rgba(0,0,0,.1);border-radius:0 0 50% 50%; }
.gfs-res-eye { position:absolute;top:24%;width:22%;height:26%;background:#fff;border-radius:50%; }
.gfs-res-eye.l { left:16%; }
.gfs-res-eye.r { right:16%; }
.gfs-res-eye::after { content:'';position:absolute;top:18%;left:16%;width:46%;height:48%;background:#111;border-radius:50%; }
.gfs-res-eye::before { content:'';position:absolute;top:9%;right:12%;width:28%;height:28%;background:rgba(255,255,255,.9);border-radius:50%;z-index:1; }

}
</style>
</head>
<body>

<div id="nav-root"></div>
<div id="modal-root"></div>

<!-- ══════════════════════════════════════════════════════

<script>
'use strict';

/* ══════════════════════════════════════════════════════
   JELLY DEFINITIONS — 6 colors
══════════════════════════════════════════════════════ */
const JELLIES = [
  { id:0, grad:'radial-gradient(ellipse at 38% 30%, #ff9999 0%, #cc0000 100%)', res:'#e53935' },  // red
  { id:1, grad:'radial-gradient(ellipse at 38% 30%, #cc88ff 0%, #7700cc 100%)', res:'#8e24aa' },  // purple
  { id:2, grad:'radial-gradient(ellipse at 38% 30%, #99ee44 0%, #2d8a00 100%)', res:'#43a047' },  // green
  { id:3, grad:'radial-gradient(ellipse at 38% 30%, #ffee55 0%, #dd8800 100%)', res:'#f9a825' },  // yellow
  { id:4, grad:'radial-gradient(ellipse at 38% 30%, #66ccff 0%, #0044ee 100%)', res:'#1e88e5' },  // blue
  { id:5, grad:'radial-gradient(ellipse at 38% 30%, #ffbb55 0%, #dd4400 100%)', res:'#e64a19' },  // orange
];
const COLS = 8, ROWS = 8, MAX_MOVES = 20;

/* ── Candy rain for canvases ───────────────────────── */
function initRain(canvas) {
  if (!canvas) return () => {};
  const ctx = canvas.getContext('2d');
  let W, H, ps = [], raf;
  const EMOJIS = ['🍬','🍭','🍫','🍡','🍰','🍩','🍪','🍦','✨','💫'];
  function resize() { W = canvas.width = canvas.offsetWidth; H = canvas.height = canvas.offsetHeight; }
  class P {
    reset(top) { this.x=Math.random()*W; this.y=top?-30:Math.random()*H; this.e=EMOJIS[Math.floor(Math.random()*EMOJIS.length)]; this.sz=10+Math.random()*16; this.sp=.25+Math.random()*.55; this.rot=Math.random()*Math.PI*2; this.rs=(Math.random()-.5)*.02; this.wb=Math.random()*Math.PI*2; this.ws=.01+Math.random()*.016; this.op=.06+Math.random()*.1; }
    constructor() { this.reset(false); }
    tick() { this.y+=this.sp; this.rot+=this.rs; this.wb+=this.ws; this.x+=Math.sin(this.wb)*.5; if(this.y>H+30) this.reset(true); }
    draw() { ctx.save(); ctx.globalAlpha=this.op; ctx.translate(this.x,this.y); ctx.rotate(this.rot); ctx.font=`${this.sz}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(this.e,0,0); ctx.restore(); }
  }
  const ob = new ResizeObserver(() => resize()); ob.observe(canvas); resize();
  for (let i=0;i<24;i++) ps.push(new P());
  function loop() { ctx.clearRect(0,0,W,H); ps.forEach(p=>{p.tick();p.draw();}); raf=requestAnimationFrame(loop); }
  loop();
  return () => { cancelAnimationFrame(raf); ob.disconnect(); };
}

/* ── Event state ────────────────────────────────────── */
let currentEvent = null, currentUser = null, personalBest = 0;

/* ── Load event ─────────────────────────────────────── */
async function loadEvent() {
  const res = await apiFetch('/api/events/current').catch(()=>null);
  if (!res?.id) { document.getElementById('evNone').style.display='block'; return; }
  currentEvent = res;
  document.getElementById('evContent').style.display='block';
  renderHero(res);
  loadLeaderboard(res.id);
  startCountdown(new Date(res.endDate));
  currentUser = Progress.getCurrentUser();
  if (!currentUser) document.getElementById('evLoginNote').style.display='block';
}

function renderHero(ev) {
  document.title = `${ev.title} — Progress`;
  const g = ev.gradient || 'linear-gradient(-45deg,#ff6b9d,#ffd93d,#ff6b35,#c471ed)';
  const hero = document.getElementById('evHero');
  hero.style.background = g; hero.style.backgroundSize = '300% 300%';
  document.getElementById('evEmoji').textContent = ev.emoji || '🎮';
  document.getElementById('evTitle').textContent = ev.title;
  document.getElementById('evDesc').textContent  = ev.description || '';
  const prize = document.getElementById('evPrize');
  if (ev.prizeNote) { prize.textContent = ev.prizeNote; prize.style.display = ''; }
  initRain(document.getElementById('heroCanvas'));
  initRain(document.getElementById('gfsCanvas'));
}

/* ── Countdown ──────────────────────────────────────── */
let _cdTimer = null;
const _prevNums = {};
function startCountdown(endDate) {
  clearInterval(_cdTimer);
  function tick() {
    const el = document.getElementById('evCountdown'); if (!el) { clearInterval(_cdTimer); return; }
    const diff = endDate - Date.now();
    if (diff <= 0) { el.innerHTML=`<span style="font-size:13px;color:rgba(255,255,255,.7);font-family:var(--font-mono);">Event ended</span>`; clearInterval(_cdTimer); return; }
    const vals = { d:Math.floor(diff/86400000), h:Math.floor((diff%86400000)/3600000), m:Math.floor((diff%3600000)/60000), s:Math.floor((diff%60000)/1000) };
    const labels = { d:'days', h:'hrs', m:'min', s:'sec' };
    el.innerHTML = Object.entries(vals).map(([k,v],i) => {
      const str = String(v).padStart(2,'0');
      const changed = _prevNums[k] !== str; _prevNums[k]=str;
      return `${i>0?'<span class="ev-cd-sep">:</span>':''}<div class="ev-cd-unit"><span class="ev-cd-num${changed?' tick':''}" id="cdn-${k}">${str}</span><span class="ev-cd-label">${labels[k]}</span></div>`;
    }).join('');
    Object.keys(vals).forEach(k => { const e2=document.getElementById(`cdn-${k}`); if(e2?.classList.contains('tick')) setTimeout(()=>e2?.classList.remove('tick'),150); });
  }
  tick(); _cdTimer = setInterval(tick, 1000);
}

/* ── Leaderboard ────────────────────────────────────── */
function animateCount(el, target, dur=1400) {
  if (!el || typeof target !== 'number') return;
  const start=performance.now();
  function tick(now) { const p=Math.min((now-start)/dur,1); const e=1-Math.pow(1-p,3); el.textContent=Math.round(e*target).toLocaleString(); if(p<1) requestAnimationFrame(tick); }
  requestAnimationFrame(tick);
}
async function loadLeaderboard(eventId) {
  const inner = document.getElementById('lbInner');
  inner.innerHTML = `<div class="ev-lb-empty">Loading…</div>`;
  const data = await apiFetch(`/api/events/${encodeURIComponent(eventId)}/leaderboard`).catch(()=>null);
  const leaderboard = Array.isArray(data) ? data : (data?.leaderboard || []);
  const totalPlayers = data?.totalPlayers ?? leaderboard.length;
  const totalSubmissions = data?.totalSubmissions ?? 0;
  const userRank = data?.userRank ?? null;
  const userBest = data?.userBest ?? null;
  const me = Progress.getCurrentUser()?.username || '';
  const sb=document.getElementById('evStatsBar'); sb.style.display='';
  animateCount(document.getElementById('statPlayers'), totalPlayers);
  animateCount(document.getElementById('statGames'), totalSubmissions);
  if (userRank && me) { document.getElementById('statRankBox').style.display=''; document.getElementById('statRank').textContent=`#${userRank}`; }
  if (userBest !== null) { personalBest=userBest; updatePersonalBest(); }
  else if (me) { const mine=leaderboard.find(r=>r.username===me); if(mine){personalBest=mine.score;updatePersonalBest();} }
  const lbur=document.getElementById('lbUserRank');
  if (userRank && me) { lbur.style.display=''; lbur.innerHTML=`You're ranked <strong>#${userRank}</strong> out of <strong>${totalPlayers}</strong>${userBest?` · best: <strong>${userBest.toLocaleString()}</strong>`:''}`;
  } else lbur.style.display='none';
  if (!leaderboard.length) { inner.innerHTML=`<div class="ev-lb-empty">No scores yet — be first! 🎮</div>`; return; }
  const topScore = leaderboard[0]?.score || 1;
  const medals={1:'🥇',2:'🥈',3:'🥉'};
  const podClasses=['gold','silver','bronze'];
  const pod = leaderboard.slice(0,3);
  const podHTML = `<div class="ev-lb-podium">${pod.map((r,i)=>{
    const init=`<div class="ev-lb-pod-init">${(r.name||r.username).slice(0,2).toUpperCase()}</div>`;
    return `<div class="ev-lb-pod-card ${podClasses[i]||'bronze'}"><span class="ev-lb-pod-medal">${medals[r.rank]||''}</span>${init}<div class="ev-lb-pod-name">${escapeHTML(r.name||r.username)}</div><div class="ev-lb-pod-score">${r.score.toLocaleString()}</div></div>`;
  }).join('')}</div>`;
  const rowsHTML = leaderboard.slice(3).map(r=>{
    const isMe=r.username===me;
    const init=`<div class="ev-lb-av-init">${(r.name||r.username).slice(0,2).toUpperCase()}</div>`;
    const barPct=Math.round((r.score/topScore)*100);
    return `<div class="ev-lb-row">${init}<div class="ev-lb-name">${escapeHTML(r.name||r.username)}${isMe?`<span class="ev-lb-you">you</span>`:''}</div><div class="ev-lb-score-wrap"><span class="ev-lb-score">${r.score.toLocaleString()}</span><div class="ev-lb-bar-wrap"><div class="ev-lb-bar" data-w="${barPct}"></div></div></div></div>`;
  }).join('');
  inner.innerHTML = podHTML + rowsHTML;
  requestAnimationFrame(() => {
    inner.querySelectorAll('.ev-lb-row').forEach((row,i) => setTimeout(()=>row.classList.add('visible'), i*60));
    inner.querySelectorAll('.ev-lb-bar').forEach(bar => setTimeout(()=>{bar.style.width=bar.dataset.w+'%';}, 200));
  });
}
function updatePersonalBest() {
  const el=document.getElementById('evPersonalBest'); if(!el) return;
  el.style.display=personalBest>0?'':'none';
  el.innerHTML=`Your best: <strong>${personalBest.toLocaleString()}</strong>`;
}
document.getElementById('lbRefreshBtn').addEventListener('click', ()=>{ if(currentEvent) loadLeaderboard(currentEvent.id); });

/* ══════════════════════════════════════════════════════
   JELLY MATCH-3 GAME
══════════════════════════════════════════════════════ */
let grid = [], selected = null, score = 0, displayScore = 0;
let movesLeft = MAX_MOVES, animating = false, running = false;
let touchStart = null, scoreRaf = null;

/* ── Cell renderer — returns a div with CSS jelly blob ── */
function makeCell(r, c, isSelected, isDrop) {
  const div = document.createElement('div');
  div.className = `gfs-cell${isSelected?' selected':''}${isDrop?' dropping':''}`;
  div.dataset.r = r; div.dataset.c = c;
  if (grid[r][c] === null) return div;
  const j = JELLIES[grid[r][c]];
  div.innerHTML = `<div class="jelly" style="background:${j.grad}"><div class="jelly-shine"></div><div class="jelly-sheen"></div><div class="jelly-eye l"></div><div class="jelly-eye r"></div></div>`;
  return div;
}

function renderBoard(fallingSet) {
  const board = document.getElementById('gfsBoard'); if (!board) return;
  board.innerHTML = '';
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
    board.appendChild(makeCell(r, c, selected?.[0]===r&&selected?.[1]===c, fallingSet?.has(`${r},${c}`)));
  }
}

/* ── Open / close ───────────────────────────────────── */
function openGame() {
  const ov = document.getElementById('gfsOverlay');
  ov.style.display = 'flex';
  requestAnimationFrame(()=>requestAnimationFrame(()=>ov.classList.add('open')));
  document.body.style.overflow = 'hidden';
  document.getElementById('gfsResults').classList.remove('show');
  startGame();
}
function closeGame() {
  running = false;
  const ov = document.getElementById('gfsOverlay');
  ov.classList.remove('open');
  ov.addEventListener('transitionend', ()=>{ ov.style.display='none'; }, {once:true});
  document.body.style.overflow = '';
  if (currentEvent) loadLeaderboard(currentEvent.id);
}
document.getElementById('evPlayBtn').addEventListener('click', openGame);
document.getElementById('gfsCloseBtn').addEventListener('click', closeGame);
document.getElementById('gfsPlayAgainBtn').addEventListener('click', ()=>{ document.getElementById('gfsResults').classList.remove('show'); startGame(); });
document.getElementById('gfsBackBtn').addEventListener('click', closeGame);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeGame(); });

/* ── Score lerp ─────────────────────────────────────── */
function addScore(val) {
  score += val;
  if (scoreRaf) return;
  function tick() {
    const diff = score - displayScore;
    if (Math.abs(diff) < 1) { displayScore=score; scoreRaf=null; }
    else { displayScore += diff*.2; scoreRaf=requestAnimationFrame(tick); }
    const el=document.getElementById('gfsScore'); if(el) el.textContent=Math.round(displayScore).toLocaleString();
  }
  scoreRaf = requestAnimationFrame(tick);
}

function setMoves(n) {
  movesLeft = n;
  const el=document.getElementById('gfsMoves'); if(!el) return;
  el.textContent = movesLeft;
  el.classList.toggle('low', movesLeft <= 5);
  if (movesLeft <= 0) endGame();
}

/* ── Grid logic ─────────────────────────────────────── */
function randJelly() { return Math.floor(Math.random() * JELLIES.length); }
function makeGrid() {
  grid = Array.from({length:ROWS}, ()=>Array.from({length:COLS}, randJelly));
  let tries=0;
  while(findMatches().length && tries++<40) grid=Array.from({length:ROWS},()=>Array.from({length:COLS},randJelly));
}
function findMatches() {
  const m=new Set();
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS-2;c++) {
    if(grid[r][c]!==null&&grid[r][c]===grid[r][c+1]&&grid[r][c]===grid[r][c+2]) { let l=3; while(c+l<COLS&&grid[r][c]===grid[r][c+l])l++; for(let i=0;i<l;i++) m.add(`${r},${c+i}`); }
  }
  for(let c=0;c<COLS;c++) for(let r=0;r<ROWS-2;r++) {
    if(grid[r][c]!==null&&grid[r][c]===grid[r+1][c]&&grid[r][c]===grid[r+2][c]) { let l=3; while(r+l<ROWS&&grid[r][c]===grid[r+l][c])l++; for(let i=0;i<l;i++) m.add(`${r+i},${c}`); }
  }
  return [...m].map(k=>k.split(',').map(Number));
}

/* ── Swap ────────────────────────────────────────────── */
function handleClick(r,c) {
  if(animating||!running) return;
  if(!selected) { selected=[r,c]; renderBoard(); return; }
  const [sr,sc]=selected; selected=null;
  if(sr===r&&sc===c) { renderBoard(); return; }
  if(Math.abs(sr-r)+Math.abs(sc-c)!==1) { selected=[r,c]; renderBoard(); return; }
  trySwap(sr,sc,r,c);
}
function swap(r1,c1,r2,c2) { [grid[r1][c1],grid[r2][c2]]=[grid[r2][c2],grid[r1][c1]]; }
async function trySwap(r1,c1,r2,c2) {
  animating=true; swap(r1,c1,r2,c2);
  if(!findMatches().length) {
    swap(r1,c1,r2,c2);
    const board=document.getElementById('gfsBoard');
    [[r1,c1],[r2,c2]].forEach(([r,c])=>{ const el=board?.children[r*COLS+c]; if(el){el.classList.add('invalid-swap');setTimeout(()=>el.classList.remove('invalid-swap'),300);} });
    renderBoard(); animating=false; return;
  }
  setMoves(movesLeft - 1);
  await resolveMatches(1);
  animating=false;
  if(movesLeft<=0) endGame();
}

/* ── Resolve / cascade ───────────────────────────────── */
const COMBO_MSGS = ['Sweet! 🍬','Double! 💫','Triple! 🍭','Cascade! 🎉','Amazing! 🔥','Insane!! 💥','LEGENDARY!! 👑'];
async function resolveMatches(combo=1) {
  const matches=findMatches(); if(!matches.length) return;
  const pts = matches.length * 50 * Math.min(combo,5);
  addScore(pts);
  if(combo>1) {
    const el=document.getElementById('gfsCombo');
    const msg=COMBO_MSGS[Math.min(combo-2,COMBO_MSGS.length-1)];
    el.innerHTML=`<span class="gfs-combo-msg">${msg}</span>`;
    setTimeout(()=>{if(el)el.innerHTML='';},1000);
  }
  const board=document.getElementById('gfsBoard');
  // Play burst on matched cells
  matches.forEach(([r,c]) => {
    const cellEl=board?.children[r*COLS+c];
    if(cellEl){ cellEl.classList.add('matched'); const burst=document.createElement('div'); burst.className='gfs-burst'; cellEl.appendChild(burst); setTimeout(()=>burst.remove(),400); }
    grid[r][c]=null;
  });
  await sleep(300);
  // Gravity
  const fallingSet=new Set();
  for(let c=0;c<COLS;c++) {
    const col=[]; for(let r=ROWS-1;r>=0;r--) if(grid[r][c]!==null) col.push(grid[r][c]);
    const newCount=ROWS-col.length; while(col.length<ROWS) col.push(randJelly());
    for(let r=ROWS-1;r>=0;r--) { grid[r][c]=col[ROWS-1-r]; if(ROWS-1-r<newCount) fallingSet.add(`${r},${c}`); }
  }
  renderBoard(fallingSet);
  await sleep(230);
  if(findMatches().length) await resolveMatches(combo+1);
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

/* ── Hint ────────────────────────────────────────────── */
function findHint() {
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) {
    for(const [dr,dc] of [[0,1],[1,0]]) {
      const r2=r+dr,c2=c+dc; if(r2>=ROWS||c2>=COLS) continue;
      swap(r,c,r2,c2); const n=findMatches().length; swap(r,c,r2,c2);
      if(n) return [[r,c],[r2,c2]];
    }
  }
  return null;
}
document.getElementById('gfsHintBtn').addEventListener('click',()=>{
  if(!running||animating) return;
  const h=findHint(); if(!h) return;
  const board=document.getElementById('gfsBoard');
  h.forEach(([r,c])=>{ const el=board?.children[r*COLS+c]; if(!el) return; el.classList.add('hint-glow'); setTimeout(()=>el.classList.remove('hint-glow'),1600); });
});

/* ── Touch swipe ─────────────────────────────────────── */
const gfsBoard = document.getElementById('gfsBoard');
gfsBoard.addEventListener('touchstart',e=>{
  const t=e.target.closest('.gfs-cell'); if(!t) return;
  e.preventDefault();
  touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY,r:+t.dataset.r,c:+t.dataset.c};
},{passive:false});
gfsBoard.addEventListener('touchend',e=>{
  if(!touchStart||!running||animating){touchStart=null;return;}
  const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;
  const adx=Math.abs(dx),ady=Math.abs(dy);
  if(Math.max(adx,ady)<14){handleClick(touchStart.r,touchStart.c);touchStart=null;return;}
  let r2=touchStart.r,c2=touchStart.c;
  if(adx>ady) c2+=dx>0?1:-1; else r2+=dy>0?1:-1;
  if(r2>=0&&r2<ROWS&&c2>=0&&c2<COLS) trySwap(touchStart.r,touchStart.c,r2,c2);
  touchStart=null;
},{passive:false});
gfsBoard.addEventListener('click',e=>{ const t=e.target.closest('.gfs-cell'); if(t) handleClick(+t.dataset.r,+t.dataset.c); });

/* ── End game ────────────────────────────────────────── */
async function endGame() {
  if(!running) return; running=false; animating=true;
  const isNew=score>personalBest;
  // Result jelly gets the color of the winning score tier
  const resJelly=document.getElementById('gfsResJelly');
  const tier = score>2000?1:score>1000?3:score>500?4:0; // purple > yellow > blue > red
  resJelly.style.background=JELLIES[tier].grad;
  document.getElementById('gfsResTitle').textContent=isNew?'New best! 🎉':score>1500?'Amazing!':score>800?'Nice one!':'Keep going!';
  document.getElementById('gfsResScore').textContent=score.toLocaleString();
  document.getElementById('gfsResSub').textContent=isNew?'Personal best 🏅':personalBest>0?`Best: ${Math.max(personalBest,score).toLocaleString()}`:'';
  document.getElementById('gfsResStatus').textContent=currentUser?'Submitting score…':'Sign in to save your score';
  document.getElementById('gfsResults').classList.add('show');
  if(currentUser&&currentEvent) {
    const r=await apiFetch(`/api/events/${encodeURIComponent(currentEvent.id)}/score`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({score})}).catch(()=>null);
    if(r?.ok){personalBest=Math.max(personalBest,r.best??score);updatePersonalBest();document.getElementById('gfsResStatus').textContent='Score saved ✓';}
    else document.getElementById('gfsResStatus').textContent='';
  }
  animating=false;
}

/* ── Start game ──────────────────────────────────────── */
function startGame() {
  score=0; displayScore=0; selected=null; animating=false; running=false;
  const scoreEl=document.getElementById('gfsScore'); if(scoreEl) scoreEl.textContent='0';
  document.getElementById('gfsCombo').innerHTML='';
  document.getElementById('gfsHintBtn').disabled=false;
  makeGrid(); renderBoard(); running=true; setMoves(MAX_MOVES);
}

/* ── Boot ────────────────────────────────────────────── */
const ready = initShell('event');
async function boot() {
  await ready.catch(()=>{});
  currentUser = Progress.getCurrentUser();
  await loadEvent();
  if(currentEvent&&new URLSearchParams(location.search).get('play')==='1') openGame();
}
boot();
</script>
