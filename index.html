<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress — a journal for what you're building</title>
<meta property="og:site_name" content="Progress">
<meta property="og:type" content="website">
<meta property="og:url" content="https://progressing.online/index.html">
<meta property="og:title" content="Progress — a journal for what you're building">
<meta property="og:description" content="A running record of things made, fixed, rebuilt, and understood a little better than yesterday.">
<meta property="og:image" content="https://progressing.online/images/nearheader.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Progress — a journal for what you're building">
<meta name="twitter:description" content="A running record of things made, fixed, rebuilt, and understood a little better than yesterday.">
<meta name="twitter:image" content="https://progressing.online/images/nearheader.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>(function(){try{var t=localStorage.getItem("progressTheme");var dark=(t==="dark")||(t!=="light"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(dark)document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<style>
/* ── Event feed card ──────────────────────────────────────────── */
.event-feed-card {
  display: block; border-radius: 24px; padding: 26px 24px 22px;
  margin-bottom: 24px; position: relative; overflow: hidden;
  text-decoration: none; color: #fff;
  background-size: 300% 300%;
  animation: efc-grad 8s ease infinite;
  transition: transform .18s, box-shadow .18s;
  box-shadow: 0 8px 32px rgba(0,0,0,.18);
}
@keyframes efc-grad {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.event-feed-card:hover { transform: translateY(-4px); box-shadow: 0 18px 48px rgba(0,0,0,.26); }
/* shimmer sweep */
.event-feed-card::after {
  content: ""; position: absolute; inset: 0; z-index: 0;
  background: linear-gradient(108deg, transparent 35%, rgba(255,255,255,.14) 50%, transparent 65%);
  animation: efc-shimmer 4.5s ease-in-out infinite;
  pointer-events: none;
}
@keyframes efc-shimmer { 0%{transform:translateX(-130%)} 100%{transform:translateX(230%)} }
/* dark scrim */
.event-feed-card::before {
  content: ""; position: absolute; inset: 0; z-index: 0;
  background: linear-gradient(160deg, rgba(0,0,0,.0) 0%, rgba(0,0,0,.3) 100%);
}
/* floating candy bg */
.efc-floats { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.efc-float {
  position: absolute; font-size: var(--efz,22px); opacity: var(--efo,.09);
  animation: efc-bob var(--efd,7s) ease-in-out var(--efx,0s) infinite;
}
@keyframes efc-bob {
  0%,100%{transform:translateY(0) rotate(var(--efr,0deg))}
  50%{transform:translateY(-10px) rotate(calc(var(--efr,0deg)+10deg))}
}
.efc-inner { position: relative; z-index: 1; }
/* top row */
.efc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.efc-top-left { display: flex; flex-direction: column; gap: 8px; }
.efc-live {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.2); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.28);
  border-radius: 30px; padding: 4px 12px;
  font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .12em;
  width: fit-content;
}
.efc-live-dot {
  width: 7px; height: 7px; border-radius: 50%; background: #fff;
  animation: efc-pulse 1.4s ease-in-out infinite;
  box-shadow: 0 0 0 0 rgba(255,255,255,.5);
}
@keyframes efc-pulse {
  0%   { transform:scale(1); box-shadow:0 0 0 0 rgba(255,255,255,.6); }
  70%  { transform:scale(1.1); box-shadow:0 0 0 5px rgba(255,255,255,0); }
  100% { transform:scale(1); box-shadow:0 0 0 0 rgba(255,255,255,0); }
}
.efc-emoji-title { display: flex; align-items: center; gap: 12px; }
.efc-emoji { font-size: 44px; line-height: 1; flex-shrink: 0; }
.efc-title {
  font-family: var(--font-display); font-size: clamp(24px, 4.5vw, 34px);
  font-style: italic; font-weight: 600; color: #fff;
  margin: 0; line-height: 1.05; text-shadow: 0 2px 10px rgba(0,0,0,.2);
}
.efc-players {
  font-size: 12px; color: rgba(255,255,255,.75);
  font-family: var(--font-mono); margin-top: 4px;
}
.efc-teaser {
  font-size: 14px; color: rgba(255,255,255,.9);
  margin: 0 0 18px; line-height: 1.55; max-width: 440px;
}
/* bottom */
.efc-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
/* countdown */
.efc-countdown { display: flex; align-items: center; gap: 5px; }
.efc-unit { background: rgba(0,0,0,.28); border-radius: 10px; padding: 6px 10px; text-align: center; min-width: 46px; }
.efc-unit-num { display: block; font-family: var(--font-mono); font-size: 18px; font-weight: 700; line-height: 1; color: #fff; }
.efc-unit-label { display: block; font-size: 8.5px; text-transform: uppercase; letter-spacing: .08em; color: rgba(255,255,255,.6); margin-top: 2px; }
.efc-sep { font-size: 16px; font-weight: 700; color: rgba(255,255,255,.35); }
/* CTA */
.efc-cta {
  display: inline-flex; align-items: center; gap: 8px;
  background: #fff; color: #1a1a1a;
  border-radius: 30px; padding: 10px 22px;
  font-size: 14px; font-weight: 800; letter-spacing: .01em;
  transition: transform .15s, box-shadow .15s; white-space: nowrap;
  box-shadow: 0 4px 14px rgba(0,0,0,.15);
}
.efc-cta:hover { transform: scale(1.05); box-shadow: 0 8px 20px rgba(0,0,0,.2); }
.efc-cta-arrow { font-size: 16px; }
</style>
</head>
<body>

<div id="nav-root"></div>
<div id="modal-root"></div>

<main class="container">
  <header class="feed-header">
    <h1><img class="header-icon" src="images/etc1.png" alt="Progress icon"> Progress</h1>
    <p>A running record of things made, fixed, rebuilt, and understood a little better than yesterday.</p>
  </header>

  <!-- Category tabs — only rendered when the feature is enabled in settings -->
  <div id="feedTabsWrap" style="display:none;">
    <div class="feed-tabs" id="feedTabs" role="tablist" aria-label="Filter posts by category">
      <button class="feed-tab-btn active" data-cat="all" role="tab" aria-selected="true">All</button>
      <button class="feed-tab-btn" data-cat="following" role="tab" aria-selected="false">Following</button>
      <button class="feed-tab-btn" data-cat="development" role="tab" aria-selected="false"><span class="feed-tab-dot"></span>Development</button>
      <button class="feed-tab-btn" data-cat="creative" role="tab" aria-selected="false"><span class="feed-tab-dot"></span>Creative</button>
      <button class="feed-tab-btn" data-cat="random" role="tab" aria-selected="false"><span class="feed-tab-dot"></span>Random</button>
    </div>
  </div>

  <div id="streakBanner" style="display:none;"></div>

  <div id="eventBanner" style="display:none;"></div>

  <div class="timeline" id="timeline">
    <div class="feed-loading-state" id="feedLoading">
      <img src="images/emoticons/sharkcat.png" alt="" class="feed-loading-img">
      <p class="feed-loading-text">fetching posts&hellip;</p>
    </div>
  </div>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
  const CATEGORY_COLORS = { development: "cat-development", creative: "cat-creative", random: "cat-random" };
  const READ_KEY = "progress:readPosts";

  function getReadSet() {
    try { return new Set(JSON.parse(localStorage.getItem(READ_KEY) || "[]")); } catch(e) { return new Set(); }
  }
  function markRead(postId) {
    try {
      const s = getReadSet();
      s.add(postId);
      // Keep only the last 500 to avoid unbounded growth
      const arr = Array.from(s).slice(-500);
      localStorage.setItem(READ_KEY, JSON.stringify(arr));
    } catch(e) {}
  }

  let activeCategory = getActiveCategory(); // from app.js helper

  // ── Category tabs ──────────────────────────────────────────────────────────
  function initCategoryTabs() {
    const wrap = document.getElementById("feedTabsWrap");
    if (!getCategoryTabsEnabled()) { wrap.style.display = "none"; return; }
    wrap.style.display = "block";

    const tabs = document.querySelectorAll(".feed-tab-btn");
    tabs.forEach(btn => {
      btn.classList.toggle("active", btn.dataset.cat === activeCategory);
      btn.setAttribute("aria-selected", String(btn.dataset.cat === activeCategory));
      btn.addEventListener("click", () => {
        activeCategory = btn.dataset.cat;
        setActiveCategory(activeCategory);
        tabs.forEach(t => {
          t.classList.toggle("active", t.dataset.cat === activeCategory);
          t.setAttribute("aria-selected", String(t.dataset.cat === activeCategory));
        });
        renderFeed();
      });
    });
  }

  // ── Streak banner (mobile) ─────────────────────────────────────────────────
  function renderStreakBanner() {
    const banner = document.getElementById("streakBanner");
    if (!banner) return;
    const me = Progress.getCurrentUser();
    if (!me || me.streak < 1) { banner.style.display = "none"; return; }
    banner.style.display = "block";
    banner.innerHTML = `<div style="display:flex; align-items:center; gap:8px; padding:10px 14px; margin-bottom:12px; border-radius:10px; background:var(--mocha-wash); font-size:13.5px; color:var(--muted);">
      <span style="font-size:18px;">🔥</span>
      <span><strong style="color:var(--ink);">${me.streak}-day streak</strong></span>
    </div>`;
  }

  // ── Feed rendering ─────────────────────────────────────────────────────────
  function renderFeed() {
    let posts = Progress.getPosts();

    // Filter by category / following
    if (getCategoryTabsEnabled() && activeCategory && activeCategory !== "all") {
      if (activeCategory === "following") {
        const me = Progress.getCurrentUser();
        const following = (me && me.following) ? me.following : [];
        posts = posts.filter(p => following.includes(p.author));
      } else {
        posts = posts.filter(p => (p.category || "").toLowerCase() === activeCategory);
      }
    }

    const timeline = document.getElementById("timeline");

    if (!posts.length) {
      timeline.innerHTML = Progress.apiOnline === false
        ? bootingUpHTML()
        : `<div class="feed-empty">
            <h3>${activeCategory === "following" ? "Nothing from people you follow yet" : activeCategory && activeCategory !== "all" ? "Nothing in this category yet" : "Nothing here yet"}</h3>
            <p>${activeCategory === "following" ? "Follow some writers and their posts will show up here." : activeCategory && activeCategory !== "all" ? "Be the first to post in this category." : "The first entry is always the hardest one to publish."}</p>
          </div>`;
      return;
    }

    const readSet = getReadSet();
    timeline.innerHTML = posts.map(p => {
      const author = Progress.getUser(p.author);
      const catClass = p.category ? (CATEGORY_COLORS[p.category.toLowerCase()] || "") : "";
      const catChip  = catClass && getCategoryTabsEnabled()
        ? `<span class="entry-category ${catClass}">${escapeHTML(p.category)}</span>`
        : "";
      const isRead = readSet.has(p.id);
      return `
      <div class="entry${isRead ? " entry--read" : ""}" data-post-id="${p.id}" data-post-href="post.html?id=${p.id}">
        <div class="entry-body">
          ${catChip}
          <span class="entry-date">${Progress.formatDateShort(p.date)}</span>
          <h2 class="entry-title"><a class="entry-link" href="post.html?id=${p.id}"><span class="underline">${renderEmoticonsText(p.title, "inline-emoticon")}</span></a></h2>
          <p class="entry-excerpt">${renderEmoticonsText(p.excerpt, "inline-emoticon")}</p>
          <div class="entry-meta">
            <span>${ICONS.heart.replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" width="13" height="13"')} ${p.likes}</span>
            <span class="entry-author">${avatarHTML(author, 22)}<a class="username-link" href="user.html?id=${author ? author.id : ""}" onclick="event.stopPropagation()">@${p.author}</a></span>
          </div>
          <div class="live-readers" id="lv-${p.id}"></div>
        </div>
        ${p.cover ? `<div class="entry-thumb"><img src="${p.cover}" alt="" loading="lazy"></div>` : ""}
      </div>`;
    }).join("");

    timeline.querySelectorAll(".entry").forEach(entry => {
      entry.addEventListener("click", event => {
        if (event.target.closest("a.username-link")) return;
        const href = entry.dataset.postHref;
        if (href) {
          markRead(entry.dataset.postId);
          entry.classList.add("entry--read");
          location.href = href;
        }
      });
    });
  }

  // ── New posts button ──────────────────────────────────────────────────────
  let _lastPostCount = 0;
  let _newPostsAvailable = 0;

  function showNewPostsBtn(count) {
    let btn = document.getElementById("newPostsBtn");
    if (!btn) {
      btn = document.createElement("button");
      btn.id = "newPostsBtn";
      btn.className = "new-posts-btn";
      const timeline = document.getElementById("timeline");
      timeline.parentNode.insertBefore(btn, timeline);
    }
    btn.textContent = count === 1 ? "1 new post ↑" : `${count} new posts ↑`;
    btn.classList.add("visible");
    btn.onclick = () => {
      btn.classList.remove("visible");
      renderFeed();
      window.scrollTo({ top: 0, behavior: "smooth" });
      _newPostsAvailable = 0;
    };
  }

  async function checkForNewPosts() {
    await Progress.loadFromApi().catch(() => {});
    const posts = Progress.getPosts();
    if (_lastPostCount === 0) { _lastPostCount = posts.length; return; }
    const diff = posts.length - _lastPostCount;
    if (diff > 0) {
      _newPostsAvailable += diff;
      _lastPostCount = posts.length;
      showNewPostsBtn(_newPostsAvailable);
    }
  }

  // ── Event banner ───────────────────────────────────────────────────────────
  let _efcTimer = null;
  async function renderEventBanner() {
    const banner = document.getElementById("eventBanner");
    if (!banner) return;
    try {
      const ev = await apiFetch("/api/events/current");
      if (!ev || !ev.id) { banner.style.display = "none"; return; }

      const FLOATIES = ["🍬","🍭","🍫","🍡","🍰","🍩","🍪","🍦","🎀","✨","🌟","💫"];
      const floatHTML = FLOATIES.map(e => {
        const top  = (4  + Math.random() * 82).toFixed(1);
        const left = (2  + Math.random() * 92).toFixed(1);
        const sz   = (14 + Math.random() * 20).toFixed(0);
        const op   = (.05 + Math.random() * .08).toFixed(2);
        const dur  = (5  + Math.random() * 5).toFixed(1);
        const del  = (Math.random() * 4).toFixed(1);
        const rot  = (-30 + Math.random() * 60).toFixed(0);
        return `<span class="efc-float" style="top:${top}%;left:${left}%;--efz:${sz}px;--efo:${op};--efd:${dur}s;--efx:${del}s;--efr:${rot}deg;">${e}</span>`;
      }).join("");

      // Fetch player count (non-blocking)
      apiFetch(`/api/events/${encodeURIComponent(ev.id)}/leaderboard`).then(data => {
        const n = data?.totalPlayers ?? (Array.isArray(data) ? data.length : null);
        const el = document.getElementById("efcPlayerCount");
        if (el && n !== null && n > 0) el.textContent = `${n} player${n !== 1 ? "s" : ""} competing`;
      }).catch(() => {});

      const gradient = ev.gradient || "linear-gradient(-45deg,#ff6b9d,#ffd93d,#ff6b35,#c471ed,#f64f59)";
      banner.style.display = "block";
      banner.innerHTML = `
        <a class="event-feed-card" href="event.html" style="background:${gradient};background-size:300% 300%;">
          <div class="efc-floats">${floatHTML}</div>
          <div class="efc-inner">
            <div class="efc-top">
              <div class="efc-top-left">
                <div class="efc-live"><span class="efc-live-dot"></span>Limited time event</div>
                <div class="efc-emoji-title">
                  <span class="efc-emoji">${ev.emoji || "🎮"}</span>
                  <div>
                    <div class="efc-title">${escapeHTML(ev.title)}</div>
                    <div class="efc-players" id="efcPlayerCount"></div>
                  </div>
                </div>
              </div>
            </div>
            <p class="efc-teaser">${escapeHTML(ev.teaser || ev.description || "")}</p>
            <div class="efc-bottom">
              <div class="efc-countdown" id="efcCountdown"></div>
              <a class="efc-cta" href="event.html?play=1">▶ Play now <span class="efc-cta-arrow">→</span></a>
            </div>
          </div>
        </a>`;

      // Live countdown ticking
      const endDate = new Date(ev.endDate);
      clearInterval(_efcTimer);
      function tickCountdown() {
        const el = document.getElementById("efcCountdown");
        if (!el) { clearInterval(_efcTimer); return; }
        const diff = endDate - Date.now();
        if (diff <= 0) { el.innerHTML = `<span style="font-size:11px;color:rgba(255,255,255,.7);font-family:var(--font-mono);">Event ended</span>`; clearInterval(_efcTimer); return; }
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000)  / 60000);
        const s = Math.floor((diff % 60000)    / 1000);
        const u = (n,l) => `<div class="efc-unit"><span class="efc-unit-num">${String(n).padStart(2,"0")}</span><span class="efc-unit-label">${l}</span></div>`;
        const sep = `<span class="efc-sep">:</span>`;
        el.innerHTML = u(d,"days") + sep + u(h,"hrs") + sep + u(m,"min") + sep + u(s,"sec");
      }
      tickCountdown();
      _efcTimer = setInterval(tickCountdown, 1000);

    } catch(e) {
      banner.style.display = "none";
    }
  }

  // ── Start ──────────────────────────────────────────────────────────────────
  async function start() {
    const ready = initShell("feed");
    initCategoryTabs();
    renderFeed();
    renderStreakBanner();
    renderEventBanner();
    // Re-render as soon as posts arrive (before users finish loading)
    window.addEventListener("progress:posts-loaded", () => {
      renderFeed();
      _lastPostCount = Progress.getPosts().length;
    }, { once: true });
    ready.then(() => {
      initCategoryTabs();
      renderFeed();
      renderStreakBanner();
      _lastPostCount = Progress.getPosts().length;
      // Poll every 45 seconds for new posts
      setInterval(checkForNewPosts, 45000);
    }).catch(() => {});

    initPullToRefresh(async () => {
      await Progress.loadFromApi().catch(() => {});
      renderFeed();
      _lastPostCount = Progress.getPosts().length;
      _newPostsAvailable = 0;
      const btn = document.getElementById("newPostsBtn");
      if (btn) btn.classList.remove("visible");
    });
  }

  start();

  // Live reader avatars — update whenever the server broadcasts viewer changes
  document.addEventListener("post-viewers", e => {
    const { postId, viewers } = e.detail;
    const el = document.getElementById(`lv-${postId}`);
    if (!el) return;
    const me = Progress.getCurrentUser();
    const others = viewers.filter(v => v.username !== me?.username);
    if (!others.length) { el.innerHTML = ""; return; }
    const MAX = 5;
    const shown = others.slice(0, MAX);
    const extra = others.length - MAX;
    el.innerHTML = shown.map(v => {
      if (v.avatar) {
        return `<img class="live-av" src="${escapeHTML(v.avatar)}" title="@${escapeHTML(v.username)} is reading" alt="@${escapeHTML(v.username)}">`;
      }
      const ini = (v.name || v.username).split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
      return `<div class="live-av live-av-init" title="@${escapeHTML(v.username)} is reading">${ini}</div>`;
    }).join("") + (extra > 0 ? `<div class="live-av live-av-more">+${extra}</div>` : "");
  });
</script>

</body>
</html>
